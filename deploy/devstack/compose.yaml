# Dev stack for an end-to-end acceptance run (§3, §5–§8, §10, §13, §17).
# Every object name is fvpn-<FVPN_E2E_PREFIX>-*. Bridges do not masquerade, so
# containers have no working path to the public Internet, and published ports
# are bound to 127.0.0.1 only. Container addresses are per port-base slot so
# two stacks can be up together. The release origin stays on 192.0.<3+slot>.10
# because the artifact fetcher rejects RFC1918, loopback, documentation and
# CGNAT addresses.
name: fvpn-${FVPN_E2E_PREFIX:-e2e}

networks:
  lab:
    name: fvpn-${FVPN_E2E_PREFIX:-e2e}
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.0/24
          gateway: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.1
  origin:
    name: fvpn-${FVPN_E2E_PREFIX:-e2e}-origin
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${FVPN_E2E_ORIGIN_PREFIX:-192.0.3}.0/24
          gateway: ${FVPN_E2E_ORIGIN_PREFIX:-192.0.3}.1

volumes:
  pg:
    name: fvpn-${FVPN_E2E_PREFIX:-e2e}-pg
  nb:
    name: fvpn-${FVPN_E2E_PREFIX:-e2e}-nb

services:
  postgres:
    image: fvpn-${FVPN_E2E_PREFIX:-e2e}-postgres:17
    container_name: fvpn-${FVPN_E2E_PREFIX:-e2e}-postgres
    environment:
      POSTGRES_USER: fvpn
      POSTGRES_DB: fvpn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres.password
    ports:
      - "127.0.0.1:${FVPN_E2E_PORT_POSTGRES:-23432}:5432"
    volumes:
      - pg:/var/lib/postgresql/data
      - ${FVPN_E2E_STATE}/secrets/postgres.password:/run/secrets/postgres.password:ro
    networks:
      lab:
        ipv4_address: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fvpn -d fvpn"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: "no"

  idp:
    image: fvpn-${FVPN_E2E_PREFIX:-e2e}-idp:local
    container_name: fvpn-${FVPN_E2E_PREFIX:-e2e}-idp
    command:
      - -addr
      - :443
      - -cert
      - /certs/idp.crt
      - -key
      - /certs/idp.key
      - -assume-secret-file
      - /secrets/assume.secret
      - -client-secret-file
      - /secrets/oidc.secret
      - -issuer
      - https://idp.example.invalid
      - -client-id
      - portal-e2e
      - -redirect
      - https://portal.example.invalid:8443/auth/callback
    ports:
      - "127.0.0.1:${FVPN_E2E_PORT_IDP:-18444}:443"
    volumes:
      - ${FVPN_E2E_STATE}/certs:/certs:ro
      - ${FVPN_E2E_STATE}/secrets/assume.secret:/secrets/assume.secret:ro
      - ${FVPN_E2E_STATE}/secrets/oidc.secret:/secrets/oidc.secret:ro
    networks:
      lab:
        ipv4_address: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.11
        aliases: [idp.example.invalid]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"

  payment:
    image: fvpn-${FVPN_E2E_PREFIX:-e2e}-payment:local
    container_name: fvpn-${FVPN_E2E_PREFIX:-e2e}-payment
    command:
      - -addr
      - :443
      - -cert
      - /certs/payment.crt
      - -key
      - /certs/payment.key
      - -api-key-file
      - /secrets/stripe.key
    ports:
      - "127.0.0.1:${FVPN_E2E_PORT_PAYMENT:-18446}:443"
    volumes:
      - ${FVPN_E2E_STATE}/certs:/certs:ro
      - ${FVPN_E2E_STATE}/secrets/stripe.key:/secrets/stripe.key:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      lab:
        ipv4_address: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.12
        aliases: [api.stripe.com]
    restart: "no"

  origin:
    image: fvpn-${FVPN_E2E_PREFIX:-e2e}-origin:local
    container_name: fvpn-${FVPN_E2E_PREFIX:-e2e}-origin
    command:
      - -addr
      - :443
      - -cert
      - /certs/origin.crt
      - -key
      - /certs/origin.key
      - -dir
      - /var/lib/releases
      - -secret-file
      - /secrets/origin.secret
    ports:
      - "127.0.0.1:${FVPN_E2E_PORT_ORIGIN:-18445}:443"
    volumes:
      - ${FVPN_E2E_STATE}/certs:/certs:ro
      - ${FVPN_E2E_STATE}/secrets/origin.secret:/secrets/origin.secret:ro
      - ${FVPN_E2E_STATE}/releases:/var/lib/releases
    networks:
      origin:
        ipv4_address: ${FVPN_E2E_ORIGIN_PREFIX:-192.0.3}.10
        aliases: [releases.example.invalid]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"

  netbird:
    image: fvpn-${FVPN_E2E_PREFIX:-e2e}-netbird:0.82.0
    container_name: fvpn-${FVPN_E2E_PREFIX:-e2e}-netbird
    entrypoint: ["/go/bin/netbird-server"]
    command: ["--config", "/etc/netbird/config.yaml"]
    environment:
      # Skip the GeoLite download. disableGeoliteUpdate still fetches a missing DB.
      NB_DISABLE_GEOLOCATION: "true"
      # POST /api/setup returns personal_access_token only when this is set.
      # The lab IdP is not the management owner issuer; the embedded setup API is.
      NB_SETUP_PAT_ENABLED: "true"
    volumes:
      - ${FVPN_E2E_STATE}/netbird/config.yaml:/etc/netbird/config.yaml:ro
      - nb:/var/lib/netbird
    networks:
      lab:
        ipv4_address: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.20
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 15s
    restart: "no"

  gateway:
    image: fvpn-${FVPN_E2E_PREFIX:-e2e}-nginx:1.30.0
    container_name: fvpn-${FVPN_E2E_PREFIX:-e2e}-gateway
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "127.0.0.1:${FVPN_E2E_PORT_GATEWAY:-18480}:443"
      - "127.0.0.1:${FVPN_E2E_PORT_STUN:-21478}:3478/udp"
    volumes:
      - ${FVPN_E2E_STATE}/render/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${FVPN_E2E_STATE}/certs:/certs:ro
    depends_on:
      netbird:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.21
        aliases: [netbird.example.invalid]
    restart: "no"

  coredns:
    image: fvpn-${FVPN_E2E_PREFIX:-e2e}-coredns:1.12.0
    container_name: fvpn-${FVPN_E2E_PREFIX:-e2e}-coredns
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ${FVPN_E2E_STATE}/render/coredns:/etc/coredns:ro
    networks:
      lab:
        ipv4_address: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.54
    restart: "no"

  adguard:
    image: fvpn-${FVPN_E2E_PREFIX:-e2e}-adguard:v0.107.59
    container_name: fvpn-${FVPN_E2E_PREFIX:-e2e}-adguard
    command: ["--no-check-update", "--no-permcheck", "-c", "/opt/adguardhome/conf/AdGuardHome.yaml", "-w", "/opt/adguardhome/work"]
    volumes:
      # Directory mount: AdGuard rewrites the file with rename, which fails on a file bind.
      - ${FVPN_E2E_STATE}/adguard/conf:/opt/adguardhome/conf
      - ${FVPN_E2E_STATE}/adguard/work:/opt/adguardhome/work
    depends_on: [coredns]
    networks:
      lab:
        ipv4_address: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.53
    restart: "no"

  control:
    image: fvpn-${FVPN_E2E_PREFIX:-e2e}-control:local
    container_name: fvpn-${FVPN_E2E_PREFIX:-e2e}-control
    command: ["-config", "/etc/fvpn/central.json", "-migrate-on-start"]
    environment:
      SSL_CERT_FILE: /certs/ca.pem
    ports:
      - "127.0.0.1:${FVPN_E2E_PORT_CONTROL:-18443}:8443"
      - "127.0.0.1:${FVPN_E2E_PORT_AGENT:-19443}:9443"
    volumes:
      - ${FVPN_E2E_STATE}/config:/etc/fvpn:ro
      - ${FVPN_E2E_STATE}/secrets:/secrets:ro
      - ${FVPN_E2E_STATE}/ca.pem:/certs/ca.pem:ro
      - ${FVPN_E2E_STATE}/vault:/var/lib/fvpn/vault
    depends_on:
      postgres:
        condition: service_healthy
      idp:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.30
        aliases: [portal.example.invalid, agent.example.invalid]
      origin: {}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://127.0.0.1:8443/readyz"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: "no"

  worker:
    image: fvpn-${FVPN_E2E_PREFIX:-e2e}-worker:local
    container_name: fvpn-${FVPN_E2E_PREFIX:-e2e}-worker
    command: ["-config", "/etc/fvpn/central.json"]
    environment:
      SSL_CERT_FILE: /certs/ca.pem
      FVPN_METRICS_ADDRESS: ":9092"
    volumes:
      - ${FVPN_E2E_STATE}/config:/etc/fvpn:ro
      - ${FVPN_E2E_STATE}/secrets:/secrets:ro
      - ${FVPN_E2E_STATE}/ca.pem:/certs/ca.pem:ro
      - ${FVPN_E2E_STATE}/vault:/var/lib/fvpn/vault
    depends_on:
      postgres:
        condition: service_healthy
      control:
        condition: service_healthy
    networks:
      lab:
        ipv4_address: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.31
      origin: {}
    restart: "no"

  node:
    image: fvpn-${FVPN_E2E_PREFIX:-e2e}-node:local
    container_name: fvpn-${FVPN_E2E_PREFIX:-e2e}-node
    privileged: true
    environment:
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    volumes:
      - ${FVPN_E2E_STATE}/node/etc:/etc/vpn-node
      - ${FVPN_E2E_STATE}/node/var:/var/lib/vpn-node
    depends_on:
      control:
        condition: service_healthy
      gateway:
        condition: service_started
      adguard:
        condition: service_started
    networks:
      lab:
        ipv4_address: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.40
      origin: {}
    restart: "no"

  member:
    image: fvpn-${FVPN_E2E_PREFIX:-e2e}-node:local
    container_name: fvpn-${FVPN_E2E_PREFIX:-e2e}-member
    entrypoint: ["/usr/local/bin/entrypoint-member.sh"]
    cap_add: [NET_ADMIN, NET_RAW]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${FVPN_E2E_STATE}/node/etc/ca.pem:/etc/vpn-node/ca.pem:ro
      - ${FVPN_E2E_STATE}/member/var:/var/lib/vpn-node
    depends_on:
      gateway:
        condition: service_started
    networks:
      lab:
        ipv4_address: ${FVPN_E2E_LAB_PREFIX:-172.28.30}.41
    restart: "no"
