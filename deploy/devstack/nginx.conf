worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    include /etc/nginx/mime.types;
    client_max_body_size 4m;
    # Resolve at request time. A static upstream is looked up when nginx starts,
    # which fails if the netbird container is not in DNS yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8443 ssl;
        server_name portal.example.invalid;
        ssl_certificate /certs/control.crt;
        ssl_certificate_key /certs/control.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /srv/portal;
        # TEST ONLY provider return hook for the Portal's existing billing route.
        location = /billing/return { return 302 /member/billing?checkout=return; }
        location ~ ^/(api/|auth/|readyz$|healthz$) {
            set $control_up control:8443;
            proxy_pass https://$control_up;
            proxy_ssl_trusted_certificate /trusted-ca.pem;
            proxy_ssl_verify on;
            proxy_ssl_name portal.example.invalid;
            proxy_ssl_server_name on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / { try_files $uri /index.html; }
    }
    server {
        listen 443 ssl http2;
        server_name netbird.example.invalid;
        ssl_certificate /certs/netbird.crt;
        ssl_certificate_key /certs/netbird.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /api/ {
            set $nb_up netbird:8080;
            proxy_pass http://$nb_up;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 1h;
        }
        # Portal code exchange and the merged JWKS. Dex remains the
        # authorization server for every other /oauth2/ path, including
        # the device flow. The adapter re-signs only the portal ID token.
        location = /oauth2/token {
            set $idp_up idp:8081;
            proxy_pass http://$idp_up;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location = /oauth2/keys {
            set $idp_up idp:8081;
            proxy_pass http://$idp_up;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /oauth2/ {
            set $nb_up netbird:8080;
            proxy_pass http://$nb_up;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /relay/ {
            set $nb_up netbird:8080;
            proxy_pass http://$nb_up;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
        location /ws-proxy/ {
            set $nb_up netbird:8080;
            proxy_pass http://$nb_up;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
        location ~ ^/(management\.ManagementService|signalexchange\.SignalExchange)/ {
            set $nb_grpc netbird:8080;
            grpc_pass grpc://$nb_grpc;
            grpc_read_timeout 1h;
            grpc_send_timeout 1h;
        }
        location / { return 404; }
    }
}
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 3478 udp;
        set $nb_stun netbird:3478;
        proxy_pass $nb_stun;
        proxy_timeout 5s;
        proxy_responses 1;
    }
}
