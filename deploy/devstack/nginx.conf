worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_max_body_size 4m;
    # Resolve at request time. A static upstream is looked up when nginx starts,
    # which fails if the netbird container is not in DNS yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 443 ssl http2;
        server_name netbird.example.invalid;
        ssl_certificate /certs/netbird.crt;
        ssl_certificate_key /certs/netbird.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /api/ {
            set $nb_up netbird:8080;
            proxy_pass http://$nb_up;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 1h;
        }
        location /oauth2/ {
            set $nb_up netbird:8080;
            proxy_pass http://$nb_up;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /relay/ {
            set $nb_up netbird:8080;
            proxy_pass http://$nb_up;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
        location /ws-proxy/ {
            set $nb_up netbird:8080;
            proxy_pass http://$nb_up;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
        location ~ ^/(management\.ManagementService|signalexchange\.SignalExchange)/ {
            set $nb_grpc netbird:8080;
            grpc_pass grpc://$nb_grpc;
            grpc_read_timeout 1h;
            grpc_send_timeout 1h;
        }
        location / { return 404; }
    }
}
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 3478 udp;
        set $nb_stun netbird:3478;
        proxy_pass $nb_stun;
        proxy_timeout 5s;
        proxy_responses 1;
    }
}
