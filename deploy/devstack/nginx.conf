worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_max_body_size 4m;
    server {
        listen 443 ssl;
        http2 on;
        server_name netbird.example.invalid;
        ssl_certificate /certs/netbird.crt;
        ssl_certificate_key /certs/netbird.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location /api/ {
            proxy_pass http://netbird:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 1h;
        }
        location /oauth2/ {
            proxy_pass http://netbird:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /relay/ {
            proxy_pass http://netbird:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
        location /ws-proxy/ {
            proxy_pass http://netbird:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 1h;
        }
        location ~ ^/(management\.ManagementService|signalexchange\.SignalExchange)/ {
            grpc_pass grpc://netbird:8080;
            grpc_read_timeout 1h;
            grpc_send_timeout 1h;
        }
        location / { return 404; }
    }
}
stream {
    server {
        listen 3478 udp;
        proxy_pass netbird:3478;
        proxy_timeout 5s;
        proxy_responses 1;
    }
}
