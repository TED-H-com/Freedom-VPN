worker_processes 1;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    include /etc/nginx/conf.d/*.conf;
}
stream {
    server {
        listen 3478 udp;
        proxy_pass server:3478;
        proxy_timeout 5s;
        proxy_responses 1;
    }
}
