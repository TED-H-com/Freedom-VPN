name: ${FVPN_DNS_PREFIX:-fvpn-dev-adguard}

services:
  upstream:
    image: docker.io/coredns/coredns:1.12.0@sha256:40384aa1f5ea6bfdc77997d243aec73da05f27aed0c5e9d65bfa98933c519d97
    container_name: ${FVPN_DNS_PREFIX:-fvpn-dev-adguard}-upstream
    command: ["-conf", "/etc/coredns/Corefile", "-dns.port", "5353"]
    ports:
      - "127.0.0.1:${FVPN_DNS_UPSTREAM_PORT:-15350}:5353/udp"
      - "127.0.0.1:${FVPN_DNS_UPSTREAM_PORT:-15350}:5353/tcp"
    volumes:
      - ./coredns:/etc/coredns:ro
    networks:
      - dnsnet
    restart: unless-stopped

  resolver1:
    image: docker.io/adguard/adguardhome:v0.107.59@sha256:5d5e3aef39a8c8906a324f0c2da0a6123929e459b57c1e3f05e401dca5c7bf02
    container_name: ${FVPN_DNS_PREFIX:-fvpn-dev-adguard}-resolver1
    user: "${FVPN_HOST_UID:-1000}:${FVPN_HOST_GID:-1000}"
    depends_on:
      - upstream
    command:
      - "--no-check-update"
      - "--no-permcheck"
      - "-c"
      - "/opt/adguardhome/conf/AdGuardHome.yaml"
      - "-w"
      - "/opt/adguardhome/work"
    ports:
      - "127.0.0.1:${FVPN_DNS_RESOLVER1_DNS_PORT:-15351}:5353/udp"
      - "127.0.0.1:${FVPN_DNS_RESOLVER1_DNS_PORT:-15351}:5353/tcp"
      - "127.0.0.1:${FVPN_DNS_RESOLVER1_HTTP_PORT:-18081}:8080/tcp"
    volumes:
      - ./.state/resolver1/conf:/opt/adguardhome/conf
      - ./.state/resolver1/work:/opt/adguardhome/work
    networks:
      - dnsnet
    restart: unless-stopped

  resolver2:
    image: docker.io/adguard/adguardhome:v0.107.59@sha256:5d5e3aef39a8c8906a324f0c2da0a6123929e459b57c1e3f05e401dca5c7bf02
    container_name: ${FVPN_DNS_PREFIX:-fvpn-dev-adguard}-resolver2
    user: "${FVPN_HOST_UID:-1000}:${FVPN_HOST_GID:-1000}"
    depends_on:
      - upstream
    command:
      - "--no-check-update"
      - "--no-permcheck"
      - "-c"
      - "/opt/adguardhome/conf/AdGuardHome.yaml"
      - "-w"
      - "/opt/adguardhome/work"
    ports:
      - "127.0.0.1:${FVPN_DNS_RESOLVER2_DNS_PORT:-15352}:5353/udp"
      - "127.0.0.1:${FVPN_DNS_RESOLVER2_DNS_PORT:-15352}:5353/tcp"
      - "127.0.0.1:${FVPN_DNS_RESOLVER2_HTTP_PORT:-18082}:8080/tcp"
    volumes:
      - ./.state/resolver2/conf:/opt/adguardhome/conf
      - ./.state/resolver2/work:/opt/adguardhome/work
    networks:
      - dnsnet
    restart: unless-stopped

networks:
  dnsnet:
    name: ${FVPN_DNS_PREFIX:-fvpn-dev-adguard}-net
    driver: bridge
