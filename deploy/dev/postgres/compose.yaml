name: fvpn-dev-postgres
services:
  postgres:
    image: postgres:17
    container_name: fvpn-dev-postgres
    environment:
      POSTGRES_DB: fvpn_dev
      POSTGRES_USER: fvpn_dev
      # TEST ONLY - NOT A SECRET. Never deploy this development password.
      POSTGRES_PASSWORD: test-only-not-a-secret
    ports:
      - "127.0.0.1:${FVPN_POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fvpn_dev -d fvpn_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
    name: fvpn-dev-postgres-data
