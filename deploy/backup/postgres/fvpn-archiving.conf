# Freedom VPN Central PostgreSQL 17 WAL Archiving Configuration (§3.1, §15.4, §17.2)
#
# Loaded via include_dir = '/etc/postgresql/conf.d' in postgresql.conf.
# Production baseline: continuous WAL archiving via pgBackRest with a 300s
# archive_timeout so low-traffic windows still satisfy the <= 15m RPO target.
# Lab/CI containers may override archive_timeout via FVPN_PG_ARCHIVE_TIMEOUT
# (TEST ONLY).

wal_level = replica
archive_mode = on
archive_timeout = 300s
archive_command = 'pgbackrest --stanza=fvpn archive-push %p'
max_wal_senders = 5
