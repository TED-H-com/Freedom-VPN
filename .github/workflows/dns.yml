name: dns

on:
  push:
    paths:
      - "internal/dnspolicy/**"
      - "internal/dnspublish/**"
      - "internal/dnsfeeds/**"
      - "internal/policies/**"
      - "internal/config/dns*.go"
      - "node/dns/**"
      - "tests/netlab/dns/**"
      - "apps/worker/jobs.go"
      - "apps/worker/jobs_dns*.go"
      - "apps/worker/review_integration_test.go"
      - "db/migrations/00180_dns_publish.sql"
      - "db/migrations/00181_dns_feed_contents.sql"
      - "db/migrations/00182_dns_feed_review.sql"
      - "deploy/dev/adguard/**"
      - "docs/dns/**"
      - "mk/dns.mk"
      - ".github/workflows/dns.yml"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "internal/dnspolicy/**"
      - "internal/dnspublish/**"
      - "internal/dnsfeeds/**"
      - "internal/policies/**"
      - "internal/config/dns*.go"
      - "node/dns/**"
      - "tests/netlab/dns/**"
      - "apps/worker/jobs.go"
      - "apps/worker/jobs_dns*.go"
      - "apps/worker/review_integration_test.go"
      - "db/migrations/00180_dns_publish.sql"
      - "db/migrations/00181_dns_feed_contents.sql"
      - "db/migrations/00182_dns_feed_review.sql"
      - "deploy/dev/adguard/**"
      - "docs/dns/**"
      - "mk/dns.mk"
      - ".github/workflows/dns.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

env:
  CGO_ENABLED: "0"
  GOTOOLCHAIN: local

jobs:
  unit:
    name: DNS Unit & Cross-Compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Lint & Vet
        run: make -f mk/dns.mk dns-lint

      - name: Cross-Compile (linux/amd64 and linux/arm64)
        run: make -f mk/dns.mk dns-build

      - name: Unit Tests
        run: make -f mk/dns.mk dns-test

      - name: Pinned resolver response shape (AT20)
        run: make -f mk/dns.mk dns-response-shape

  integration:
    name: AdGuard Home Integration Suite
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    needs: unit
    env:
      FVPN_DNS_PREFIX: fvpn-ci-dns
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Start Dev AdGuard Home Stack
        run: make -f mk/dns.mk dns-up

      - name: Run Integration Tests
        run: make -f mk/dns.mk dns-test-integration

      - name: Tear Down Dev AdGuard Home Stack
        if: always()
        run: make -f mk/dns.mk dns-down

  publish:
    name: DNS publish integration
    runs-on: ubuntu-24.04
    env:
      # TEST ONLY - NOT A SECRET. Ephemeral CI service credentials.
      FVPN_TEST_DATABASE_URL: postgres://fvpn_test:test-only-not-a-secret@localhost:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fvpn_test
          POSTGRES_PASSWORD: test-only-not-a-secret # TEST ONLY - NOT A SECRET
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fvpn_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Publish integration tests
        run: make -f mk/dns.mk dns-test-publish

  lab:
    name: DNS publish lab
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Publish lab scenario
        run: make -f mk/dns.mk dns-lab
        env:
          FVPN_LAB_PREFIX: fvpn-w3-dns-publish
