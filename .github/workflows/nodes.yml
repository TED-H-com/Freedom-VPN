name: Nodes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  nodes:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
      # TEST ONLY - NOT A SECRET. Ephemeral CI service credentials.
      FVPN_TEST_DATABASE_URL: postgres://fvpn_test:test-only-not-a-secret@localhost:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fvpn_test
          POSTGRES_PASSWORD: test-only-not-a-secret # TEST ONLY - NOT A SECRET
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fvpn_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: Lint, build (amd64 + arm64) and test node registry, desired state, leases and exits
        run: make nodes-verify
