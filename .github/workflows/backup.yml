name: Backup & PITR Drill

on:
  push:
    paths:
      - "deploy/backup/**"
      - "docs/ops/backups.md"
      - "docs/ops/backups/**"
      - "docs/ops/README.md"
      - "mk/backup.mk"
      - ".github/workflows/backup.yml"
      - "tests/backup/**"
  pull_request:
    paths:
      - "deploy/backup/**"
      - "docs/ops/backups.md"
      - "docs/ops/backups/**"
      - "docs/ops/README.md"
      - "mk/backup.mk"
      - ".github/workflows/backup.yml"
      - "tests/backup/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: Lint backup scripts and Go tests
        run: make -f mk/backup.mk backup-lint
      - name: Run backup unit tests
        run: make -f mk/backup.mk backup-test

  pitr-drill:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: Execute automated pgBackRest PITR restore drill
        run: make -f mk/backup.mk backup-drill
