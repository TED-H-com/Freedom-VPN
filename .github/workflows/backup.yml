name: Backup & PITR Drill

on:
  push:
    paths:
      - "deploy/backup/**"
      - "docs/ops/backups.md"
      - "docs/handover/restore-drill.md"
      - "docs/handover/deploy.md"
      - "docs/ops/backups/**"
      - "docs/ops/README.md"
      - "mk/backup.mk"
      - ".github/workflows/backup.yml"
      - "tests/backup/**"
  pull_request:
    paths:
      - "deploy/backup/**"
      - "docs/ops/backups.md"
      - "docs/handover/restore-drill.md"
      - "docs/handover/deploy.md"
      - "docs/ops/backups/**"
      - "docs/ops/README.md"
      - "mk/backup.mk"
      - ".github/workflows/backup.yml"
      - "tests/backup/**"
  workflow_dispatch:
    inputs:
      record_evidence:
        description: Write dated drill evidence for review
        type: boolean
        default: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: Lint backup scripts and Go tests
        run: make -f mk/backup.mk backup-lint
      - name: Run backup unit tests
        run: make -f mk/backup.mk backup-test

  pitr-drill:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - name: Execute automated pgBackRest PITR restore drill
        env:
          # Per-run prefix shared by every container, volume, network, and image
          # tag. Form is documented in docs/handover/restore-drill.md.
          FVPN_BACKUP_DRILL_RECORD: ${{ github.event_name == 'workflow_dispatch' && inputs.record_evidence && '1' || '0' }}
          FVPN_BACKUP_DRILL_PREFIX: fvpn-w4-ops-backups-gha${{ github.run_id }}-${{ github.run_attempt }}
        run: make -f mk/backup.mk backup-drill

      - name: Run adversarial backup proof
        run: make -f mk/backup.mk backup-review-proof

      - name: Upload manually recorded evidence
        if: github.event_name == 'workflow_dispatch' && inputs.record_evidence
        uses: actions/upload-artifact@v4
        with:
          name: backup-drill-evidence
          path: |
            docs/ops/backups/drill-*.json
            docs/ops/backups/drill-*.md
