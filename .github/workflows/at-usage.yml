name: Usage and Fair-Use acceptance

on:
  pull_request:
    paths:
      - tests/e2e/at/usage/**
      - docs/e2e/at/usage/**
      - mk/at-usage.mk
      - .github/workflows/at-usage.yml
      - apps/**
      - contracts/*
      - contracts/schemas/**
      - db/**
      - deploy/backup/postgres/**
      - deploy/devstack/**
      - go.mod
      - go.sum
      - internal/audit/**
      - internal/auth/**
      - internal/billing/**
      - internal/config/**
      - internal/db/*
      - internal/db/dbtest/**
      - internal/desiredstate/**
      - internal/devices/**
      - internal/dnsfeeds/**
      - internal/dnspolicy/*
      - internal/dnspublish/**
      - internal/enrollment/**
      - internal/entitlement/**
      - internal/exits/**
      - internal/fleetupdate/**
      - internal/fup/**
      - internal/httpapi/*
      - internal/httpapi/gen/**
      - internal/installerjob/**
      - internal/leases/**
      - internal/members/**
      - internal/netbird/**
      - internal/nodes/**
      - internal/operations/**
      - internal/pki/*
      - internal/policies/*
      - internal/policies/schemas/**
      - internal/releases/*
      - internal/signing/*
      - internal/usage/*
      - internal/usage/cmd/**
      - mk/e2e.mk
      - node/agent/**
      - node/dns/**
      - node/enforce/**
      - node/internal/agentstore/**
      - node/internal/controlclient/**
      - node/internal/fakecontrol/*
      - node/internal/healthattest/**
      - node/internal/meter/**
      - node/internal/nodelock/**
      - node/internal/timeanchor/**
      - node/internal/updatejournal/**
      - node/internal/usagestore/**
      - node/internal/usageupload/**
      - node/nodelock/**
      - node/updater/**
      - node/watchdog/**
      - packaging/installer/*
      - packaging/release/*
      - pkg/**
      - tests/e2e/*
      - tests/e2e/cmd/fvpn-e2e-control/**
      - tests/e2e/cmd/fvpn-e2e-idp/**
      - tests/e2e/cmd/fvpn-e2e-nbbootstrap/**
      - tests/e2e/cmd/fvpn-e2e-nodeconfig/**
      - tests/e2e/cmd/fvpn-e2e-origin/**
      - tests/e2e/cmd/fvpn-e2e-payment/**
      - tests/e2e/cmd/fvpn-e2e-prepare/**
      - tests/e2e/internal/agentwait/**
      - tests/e2e/internal/counterread/**
      - tests/e2e/internal/dnsrelay/**
      - tests/e2e/internal/granttrace/**
      - tests/e2e/internal/idplogin/**
      - tests/e2e/internal/labtls/**
      - tests/e2e/internal/leasehold/**
      - tests/e2e/internal/nativecapture/**
      - tests/e2e/internal/offertrace/**
      - tests/e2e/internal/probeauth/**
      - tests/e2e/internal/streamstats/**
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  FVPN_E2E_PREFIX: w4-usage
  FVPN_E2E_PORT_BASE: "48000"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - run: make -f mk/at-usage.mk at-usage-lint at-usage-test at-usage-build

  assigned-stack:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: Start assigned w4-usage stack
        id: up
        continue-on-error: true
        run: bash tests/e2e/at/usage/stack.sh up
      - name: Run AT14-AT20 acceptance suite (blocked cases exit non-zero after writing evidence)
        if: steps.up.outcome == 'success'
        run: make -f mk/at-usage.mk at-usage
      - name: Tear down assigned w4-usage stack
        if: always() && steps.up.outcome != 'skipped'
        run: bash tests/e2e/at/usage/stack.sh down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: at-usage-evidence
          path: docs/e2e/at/usage/AT*
