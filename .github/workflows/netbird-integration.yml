name: NetBird CE adapter and G1 lab
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: read
concurrency:
  group: netbird-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  netbird:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FVPN_NB_PREFIX: fvpn-w1-netbird-ci
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit, vet and architecture checks
        run: |
          mkdir -p .agent/netbird-tmp
          export TMPDIR="$PWD/.agent/netbird-tmp"
          make -f mk/netbird.mk netbird-test netbird-vet
          test -z "$(gofmt -l internal/netbird)"
          GOOS=linux GOARCH=arm64 go build ./internal/netbird/...
          GOOS=linux GOARCH=amd64 go build ./internal/netbird/...
      - name: Start pinned isolated stack and real user clients
        run: make -f mk/netbird.mk netbird-up netbird-bootstrap
      - name: Confirm bootstrap is repeatable
        run: python3 -B deploy/dev/netbird/bootstrap.py
      - name: Integration and CLI evidence
        run: make -f mk/netbird.mk netbird-test-integration
      - name: Remove task containers, networks, volumes, images and secrets
        if: always()
        run: |
          make -f mk/netbird.mk netbird-reset
          test -z "$(docker ps -aq --filter name=fvpn-w1-netbird-ci)"
