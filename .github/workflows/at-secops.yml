name: at-secops
on:
  pull_request:
    paths:
      - 'tests/e2e/at/secops/**'
      - 'docs/e2e/at/secops/**'
      - 'mk/at-secops.mk'
      - '.github/workflows/at-secops.yml'
      - 'contracts/*'
      - 'contracts/examples/policies/fair-use.json'
      - 'contracts/schemas/**'
      - 'db/**'
      - 'deploy/backup/**'
      - 'deploy/devstack/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/audit/**'
      - 'internal/auth/**'
      - 'internal/billing/**'
      - 'internal/config/**'
      - 'internal/db/*'
      - 'internal/db/dbtest/**'
      - 'internal/devices/**'
      - 'internal/entitlement/**'
      - 'internal/httpapi/*'
      - 'internal/httpapi/gen/**'
      - 'internal/members/*'
      - 'internal/members/issuer/**'
      - 'internal/netbird/**'
      - 'internal/nodes/*'
      - 'internal/nodes/commandtx/**'
      - 'internal/operations/**'
      - 'internal/pki/**'
      - 'internal/signing/*'
      - 'internal/usage/*'
      - 'internal/usage/cmd/**'
      - 'node/agent/observe.go'
      - 'node/agent/serving.go'
      - 'node/agent/sync.go'
      - 'node/enforce/**'
      - 'node/internal/nodelock/**'
      - 'node/internal/timeanchor/**'
      - 'node/nodelock/**'
      - 'node/watchdog/*'
      - 'packaging/release/*'
      - 'pkg/**'
      - 'tests/e2e/*'
      - 'tests/e2e/internal/counterread/**'
      - 'tests/e2e/internal/dnsrelay/**'
      - 'tests/e2e/internal/granttrace/**'
      - 'tests/e2e/internal/idplogin/**'
      - 'tests/e2e/internal/labstack/**'
      - 'tests/e2e/internal/leasehold/**'
      - 'tests/e2e/internal/nativecapture/**'
      - 'tests/e2e/internal/offertrace/**'
      - 'tests/e2e/internal/streamstats/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component-checks:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: make -f mk/at-secops.mk at-secops-test at-secops-lint at-secops-build
      # The privileged acceptance run is explicit and produces blocked records
      # for serving and full mixed/relay load preconditions.
      # This job validates supporting code; it does not certify AT28–AT32.
