name: Member acceptance

on:
  pull_request:
    paths:
      - tests/e2e/at/members/**
      - docs/e2e/at/members/**
      - mk/at-members.mk
      - .github/workflows/at-members.yml
      - apps/**
      - contracts/*
      - contracts/examples/policies/fair-use.json
      - contracts/examples/valid/ObservationReport.json
      - contracts/schemas/**
      - db/**
      - deploy/backup/postgres/**
      - deploy/devstack/**
      - docs/dns/BACKEND.md
      - docs/poc/G2-f802-mtu1280-2026-10-31.md
      - go.mod
      - go.sum
      - internal/audit/**
      - internal/auth/**
      - internal/billing/**
      - internal/config/**
      - internal/db/*
      - internal/desiredstate/**
      - internal/devices/**
      - internal/dnsfeeds/**
      - internal/dnspolicy/*
      - internal/dnspublish/**
      - internal/enrollment/**
      - internal/entitlement/**
      - internal/exits/**
      - internal/fleetupdate/**
      - internal/fup/**
      - internal/httpapi/*
      - internal/httpapi/gen/**
      - internal/installerjob/**
      - internal/leases/**
      - internal/members/**
      - internal/netbird/**
      - internal/nodes/**
      - internal/operations/**
      - internal/pki/*
      - internal/policies/*
      - internal/policies/schemas/**
      - internal/releases/*
      - internal/signing/*
      - internal/usage/*
      - mk/e2e.mk
      - node/agent/**
      - node/dns/**
      - node/enforce/**
      - node/internal/agentstore/**
      - node/internal/controlclient/**
      - node/internal/healthattest/**
      - node/internal/meter/**
      - node/internal/nodelock/**
      - node/internal/timeanchor/**
      - node/internal/updatejournal/**
      - node/internal/usagestore/**
      - node/internal/usageupload/**
      - node/nodelock/**
      - node/updater/**
      - node/watchdog/**
      - packaging/installer/*
      - packaging/release/*
      - pkg/**
      - tests/e2e/*
      - tests/e2e/cmd/fvpn-e2e-control/**
      - tests/e2e/cmd/fvpn-e2e-fixture-probe/**
      - tests/e2e/cmd/fvpn-e2e-idp/**
      - tests/e2e/cmd/fvpn-e2e-lease-read/**
      - tests/e2e/cmd/fvpn-e2e-member-session/**
      - tests/e2e/cmd/fvpn-e2e-native-observe/**
      - tests/e2e/cmd/fvpn-e2e-nbbootstrap/**
      - tests/e2e/cmd/fvpn-e2e-nodeconfig/**
      - tests/e2e/cmd/fvpn-e2e-origin/**
      - tests/e2e/cmd/fvpn-e2e-payment/**
      - tests/e2e/cmd/fvpn-e2e-prepare/**
      - tests/e2e/internal/**
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  FVPN_E2E_PREFIX: w4-members
  FVPN_E2E_PORT_BASE: "24000"
  FVPN_E2E_TWO_RESOLVERS: "true"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - run: make -f mk/at-members.mk at-members-lint at-members-test at-members-build

  assigned-stack:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Attempt assigned fresh stack
        id: up
        run: E2E_RESET=1 make -f mk/e2e.mk e2e-up
      - name: Install the Portal probe browser
        if: steps.up.outcome == 'success'
        working-directory: apps/portal
        run: npx playwright install chromium
      - name: Record live acceptance (blocked is non-green)
        if: steps.up.outcome == 'success'
        run: make -f mk/at-members.mk at-members
      - name: Remove only this job's stack
        if: always() && steps.up.outcome != 'skipped'
        run: make -f mk/e2e.mk e2e-down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: at-members-evidence
          path: docs/e2e/at/members/AT*
