name: Members and billing
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
      # TEST ONLY - NOT A SECRET. Ephemeral CI service credentials.
      FVPN_TEST_DATABASE_URL: postgres://fvpn_test:test-only-not-a-secret@localhost:5432/postgres?sslmode=disable
    services:
      fvpn-w2-members-billing-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fvpn_test
          POSTGRES_PASSWORD: test-only-not-a-secret # TEST ONLY - NOT A SECRET
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fvpn_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - run: make -f mk/billing.mk billing-verify
      - run: make go-lint
      - name: Whole-module arm64 cross compilation
        run: |
          mkdir -p .agent/tmp
          task_tmp=$(mktemp -d "$PWD/.agent/tmp/arm64.XXXXXX")
          trap 'rm -rf "$task_tmp"' EXIT
          TMPDIR="$task_tmp" GOTMPDIR="$task_tmp" GOOS=linux GOARCH=arm64 go build ./...
