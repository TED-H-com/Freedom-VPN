# Privileged systemd container tests (make -f mk/installer.mk installer-test)
# need a host that can run systemd as PID 1. GitHub-hosted runners do not.
# This workflow runs lint, the library tests, and both architecture builds.
name: Installer
on:
  push:
    paths:
      - packaging/installer/**
      - deploy/node/**
      - docs/node/install.md
      - docs/node/install-*.md
      - mk/installer.mk
      - tests/installer/**
      - .github/workflows/installer.yml
      - go.mod
      - go.sum
      - contracts/*
      - contracts/schemas/**
      - db/**
      - internal/audit/**
      - internal/auth/**
      - internal/billing/**
      - internal/config/**
      - internal/db/*
      - internal/dnspolicy/*
      - internal/dnspublish/*
      - internal/entitlement/**
      - internal/httpapi/*
      - internal/httpapi/gen/**
      - internal/installerjob/**
      - internal/members/issuer/**
      - internal/nodes/commandtx/**
      - internal/operations/**
      - internal/pki/**
      - internal/signing/*
      - node/agent/*
      - node/dns/**
      - node/enforce/**
      - node/internal/agentstore/**
      - node/internal/controlclient/**
      - node/internal/fakecontrol/*
      - node/internal/healthattest/**
      - node/internal/meter/**
      - node/internal/nodelock/**
      - node/internal/timeanchor/**
      - node/internal/updatejournal/**
      - node/internal/usagestore/**
      - node/internal/usageupload/**
      - node/nodelock/**
      - node/updater/*
      - node/updater/fsutil/**
      - node/watchdog/*
      - packaging/release/*
      - pkg/**
  pull_request:
    paths:
      - packaging/installer/**
      - deploy/node/**
      - docs/node/install.md
      - docs/node/install-*.md
      - mk/installer.mk
      - tests/installer/**
      - .github/workflows/installer.yml
      - go.mod
      - go.sum
      - contracts/*
      - contracts/schemas/**
      - db/**
      - internal/audit/**
      - internal/auth/**
      - internal/billing/**
      - internal/config/**
      - internal/db/*
      - internal/dnspolicy/*
      - internal/dnspublish/*
      - internal/entitlement/**
      - internal/httpapi/*
      - internal/httpapi/gen/**
      - internal/installerjob/**
      - internal/members/issuer/**
      - internal/nodes/commandtx/**
      - internal/operations/**
      - internal/pki/**
      - internal/signing/*
      - node/agent/*
      - node/dns/**
      - node/enforce/**
      - node/internal/agentstore/**
      - node/internal/controlclient/**
      - node/internal/fakecontrol/*
      - node/internal/healthattest/**
      - node/internal/meter/**
      - node/internal/nodelock/**
      - node/internal/timeanchor/**
      - node/internal/updatejournal/**
      - node/internal/usagestore/**
      - node/internal/usageupload/**
      - node/nodelock/**
      - node/updater/*
      - node/updater/fsutil/**
      - node/watchdog/*
      - packaging/release/*
      - pkg/**
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true
      - run: make -f mk/installer.mk installer-lint
      - run: make -f mk/installer.mk installer-unit
      - run: make -f mk/installer.mk installer-build
