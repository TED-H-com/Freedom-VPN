name: Policies and Fair-Use
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policies:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
      # TEST ONLY - NOT A SECRET. Ephemeral CI service credentials.
      FVPN_TEST_DATABASE_URL: postgres://fvpn_test:test-only-not-a-secret@localhost:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fvpn_test
          POSTGRES_PASSWORD: test-only-not-a-secret # TEST ONLY - NOT A SECRET
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fvpn_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - name: Verify policies and FUP (lint, build amd64/arm64, unit tests)
        run: make -f mk/policies.mk policies-verify
      - name: Run policies and FUP PostgreSQL integration tests
        run: make -f mk/policies.mk policies-test-integration
