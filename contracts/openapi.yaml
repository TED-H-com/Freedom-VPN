          format: uuid
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    ReleaseSupportPolicyRevision:
      type: object
      required: [type, revision_id, definition_id, revision, schema_version, payload, payload_sha256, reason, created_by, created_at]
      properties:
        type:
          type: string
          enum: [release_support]
        revision_id:
          type: string
          format: uuid
        definition_id:
          type: string
          format: uuid
        revision:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        schema_version:
