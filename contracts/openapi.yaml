            application/json:
              schema:
                $ref: '#/components/schemas/CertificateRenewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agent/desired-state:
    get:
      operationId: getDesiredState
      tags: [agent]
      summary: Get this node's signed desired state
      description: |
        Returns the signed desired-state envelope for the node identified by the
        client certificate (§14.7). There is no parameter to select another node.
        Supports If-None-Match: 304 when the envelope is unchanged. The ETag covers
        the signed envelope (time and signature): re-signing without a content
        change keeps config_generation but changes the ETag. A 304 never means the
        serving lease was extended (§14.7).
      x-fvpn-spec: '§14.4, §14.7, §13.10.2'
      x-fvpn-requirements: [ISO02, UPD02, UPD04, SEC01]
      security: []
      x-fvpn-auth: agent-mtls
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Signed desired state.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-No-Store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesiredStateEnvelope'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agent/observations:
    post:
      operationId: submitObservation
      tags: [agent]
      summary: Report heartbeat and observations
      description: |
        Durably accepts heartbeat, applied configuration and observations (§14.4).
        The response states only that the report was accepted; it does not claim
        cross-verification. report_id is the idempotency key: a resend with the
        same report_id returns the original acceptance. Allowed while the node is
        disabled; rejected after permanent revocation.
      x-fvpn-spec: '§14.4, §5, §15.3'
      x-fvpn-requirements: [NODE02, ISO02, SEC01]
      security: []
      x-fvpn-auth: agent-mtls
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationReport'
      responses:
        '202':
          description: Observation durably accepted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agent/usage-batches:
    post:
      operationId: submitUsageBatch
      tags: [agent]
      summary: Submit usage events
      description: |
        Accepts §10.5 usage events and returns per-event results and the highest
        contiguous ACK after commit (§10.6). Each event is atomic on its own; a
        conflicting or invalid event never deletes the valid events after it.

        * New valid event: `accepted`.
        * Same (node_id, node_incarnation_id, event_seq) and same payload_sha256:
          `duplicate`, no bytes added.
        * Same key, different hash: `conflict` with USAGE_EVENT_CONFLICT (the
          §10.6 HTTP 409 outcome, reported per event); both contents are kept.
        * Invalid format, integer or mapping: `rejected` with VALIDATION_FAILED or
          METER_PATH_INVALID (the §10.6 HTTP 422 outcome, per event).

        `highest_contiguous_seq` counts only committed events of this incarnation
        stream, never "largest seen"; `blocked_seq` names the lowest sequence that
        stops ACK progress. Whole-request outcomes: 403 for an mTLS identity
        mismatch (no ledger change), 409 LEDGER_EPOCH_MISMATCH when the batch
        names a ledger_epoch other than the current one, 422 when the batch
        envelope is invalid, 503 when the central store cannot write (nothing is
        acknowledged).
      x-fvpn-spec: '§14.4, §10.5, §10.6, §10.8'
      x-fvpn-requirements: [MTR01, MTR02, MTR03, MTR04, DATA01]
      security: []
      x-fvpn-auth: agent-mtls
      parameters:
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageBatchRequest'
      responses:
        '200':
          description: Batch processed; see per-event results.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageBatchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agent/usage-checkpoint:
    get:
      operationId: getUsageCheckpoint
      tags: [agent]
      summary: Get the signed usage checkpoint
      description: |
        Returns the current ledger_epoch, the highest contiguous sequence, missing
        ranges and the recovery proof for this node incarnation, signed with a
        recovery key (§10.8, §17.3). After a central restore the agent accepts a
        checkpoint lower than a previous ACK only for a new, verified ledger_epoch.
      x-fvpn-spec: '§14.4, §10.8, §17.3'
      x-fvpn-requirements: [MTR03, DATA01]
      security: []
      x-fvpn-auth: agent-mtls
      responses:
        '200':
          description: Signed usage checkpoint.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-No-Store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageCheckpointEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agent/update-results:
    post:
      operationId: submitUpdateResult
      tags: [agent]
      summary: Report update job progress or result
      description: |
        Reports progress and results for this node's update jobs (§13.10.3). The
        server identifies the node from the certificate and compares the body's
        incarnation. result_id is the idempotency key and payload_hash is the
        SHA-256 of the canonical JSON of the result without `payload_hash`. Same
        result_id and hash: the original ACK. Same result_id, different hash: 409
        ACK_CONFLICT with evidence kept. Results for an older generation are
        accepted as history and never become the current observation (§13.8).
        Terminal states require version, digest and health evidence.
      x-fvpn-spec: '§14.4, §13.6, §13.8, §13.10.3'
      x-fvpn-requirements: [UPD02, UPD03, UPD05]
      security: []
      x-fvpn-auth: agent-mtls
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResult'
      responses:
        '202':
          description: Result durably accepted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateResultAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agent/lease-renewals:
    post:
      operationId: renewServingLease
      tags: [agent]
      summary: Renew the signed serving lease
      description: |
        Recomputes and signs a finite serving lease (§16.3). The lease never
        extends paid_through, grants, grace or an admin suspension; every member
        lease end is bounded by effective_service_end. Rate limited separately from
        heartbeats and usage so large batches cannot starve renewals (§14.6).
      x-fvpn-spec: '§14.4, §16.3, §9.2'
      x-fvpn-requirements: [ENT01, ENT02, ISO02, SEC01]
      security: []
      x-fvpn-auth: agent-mtls
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseRenewalRequest'
      responses:
        '200':
          description: Signed serving lease.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-No-Store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServingLeaseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ---------------------------------------------------------------- webhook
  /webhooks/{provider}:
    post:
      operationId: receiveProviderWebhook
      tags: [webhook]
      summary: Receive a payment provider webhook
      description: |
        Verifies the raw body and the provider signature, then writes the event to
        the durable inbox keyed by (provider, event_id) before answering 2xx (§9.3).
        Invalid signatures return 401 WEBHOOK_SIGNATURE_INVALID and change nothing.
        Redeliveries return 200 with `duplicate=true`. The body is the provider's
        own JSON and is kept byte-for-byte; this contract does not constrain it.
      x-fvpn-spec: '§14.4, §9.3'
      x-fvpn-requirements: [BILL01, BILL03]
      security:
        - providerWebhookSignature: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Configured provider adapter code (provider selection is a pending product decision, §9.3).
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_-]{0,31}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderWebhookPayload'
      responses:
        '200':
          description: Event already stored (redelivery).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '202':
          description: Event durably stored in the inbox; processing is asynchronous.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-fvpn-admin
      description: |
        Admin browser session from the OIDC Authorization Code + PKCE login
        (§16.1). Secure, HttpOnly, SameSite cookie; the IdP enforces MFA. Admin
        and member sessions are separate cookies.
    memberSession:
      type: apiKey
      in: cookie
      name: __Host-fvpn-member
      description: Member browser session from the OIDC login (§9.1, §16.1). The member_id always comes from this session.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        CSRF protection for state-changing browser requests (§16.1). Double-submit:
        the value must equal the `__Host-fvpn-csrf` cookie issued at login.
        Missing or mismatched: 403 CSRF_TOKEN_INVALID.
    enrollmentToken:
      type: apiKey
      in: header
      name: Authorization
      description: |
        One-time enrollment token, sent only as `Authorization: Enrollment <token>`
        (§14.7). Never in the URL, query or body. Only its hash is stored
        server-side. Unknown, expired or revoked tokens fail with 401
        ENROLLMENT_TOKEN_INVALID / _EXPIRED / _REVOKED.
    providerWebhookSignature:
      type: apiKey
      in: header
      name: Webhook-Signature
      description: |
        Payment provider signature over the raw request body (§9.3, §16.2). Each
        provider adapter verifies its own header and scheme (for example the
        `Stripe-Signature` header for a Stripe adapter); `Webhook-Signature` is the
        generic name used in this contract.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor`. Never parse or construct it (§14.1).
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[A-Za-z0-9_-]+$'
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, maximum 100 (§14.1, recommended default).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID (§14.5). Scope: principal, HTTP method, normalized
        route and key. Same key and same validated payload return the same resource
        or operation; same key and a different payload return 409
        IDEMPOTENCY_CONFLICT. Kept at least 7 days (recommended default). Missing
        header: 400 MALFORMED_REQUEST.
      schema:
        type: string
        format: uuid
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional for agent requests. Most bodies carry a natural idempotency ID
        (enrollment_request_id, renewal_request_id, report_id, result_id,
        event_seq). When present it must be a UUID and follows §14.5. Bootstrap
        has no body and deduplicates by delivery state; it never replays a
        consumed secret, even with the same key (D-015).
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Strong ETag of the resource as last read, `"<resource_version>"` (§14.5).
        Missing: 428 PRECONDITION_REQUIRED. Mismatch: 412
        RESOURCE_VERSION_CONFLICT with details.current_resource_version.
      schema:
        type: string
        pattern: '^"(0|[1-9][0-9]*)"$'
        maxLength: 22
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag of the desired-state envelope the agent already holds. Unchanged envelope returns 304.
      schema:
        type: string
        minLength: 2
        maxLength: 256
    NodeId:
      name: node_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: enrollment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberId:
      name: member_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DefinitionId:
      name: definition_id
      in: path
      required: true
      description: Policy definition ID.
      schema:
        type: string
        format: uuid
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    X-Request-ID:
      description: Central request ID (UUID) generated by the server for every response. A client-supplied value never replaces it (§14.1).
      schema:
        type: string
        format: uuid
    ETag:
      description: |
        Strong entity tag. For admin resources it is `"<resource_version>"`, so it
        can be rebuilt from the `resource_version` field. For desired state it is
        opaque and covers the whole signed envelope (§14.7).
      schema:
        type: string
    Location:
      description: URL of the created resource or of the accepted operation (for 202, `/api/v1/admin/operations/{id}` or `/api/v1/member/operations/{id}`).
      schema:
        type: string
    Retry-After:
      description: Seconds to wait before retrying (429, 503). Retry with jittered backoff and the same Idempotency-Key (§14.6).
      schema:
        type: integer
        minimum: 0
    Cache-Control-No-Store:
      description: Login, member, payment and secret-bearing responses are never cached (§14.1).
      schema:
        type: string
        enum: [no-store]

  responses:
    OperationAccepted:
      description: |
        Operation accepted. The external or data-plane effect is still pending;
        poll the operation at `Location`. Never a completion signal (§14.1).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Location:
          $ref: '#/components/headers/Location'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
    NotModified:
      description: The desired-state envelope is unchanged. Does not extend the serving lease.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        ETag:
          $ref: '#/components/headers/ETag'
    BadRequest:
      description: MALFORMED_REQUEST. Malformed JSON, unknown member or missing required header. Do not retry unchanged.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: UNAUTHENTICATED, ENROLLMENT_TOKEN_INVALID, ENROLLMENT_TOKEN_EXPIRED, ENROLLMENT_TOKEN_REVOKED or WEBHOOK_SIGNATURE_INVALID.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: FORBIDDEN, CSRF_TOKEN_INVALID, IDENTITY_REVOKED or INCARNATION_MISMATCH. A revoked machine identity cannot recover by retrying.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: RESOURCE_NOT_FOUND. Also returned for resources of another member, so existence is never revealed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BootstrapNotReady:
      description: BOOTSTRAP_NOT_READY. Worker has not prepared the delivery; retryable=true with the same request.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control-No-Store'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BootstrapGone:
      description: BOOTSTRAP_CONSUMED after delivery, or BOOTSTRAP_EXPIRED after an unconsumed delivery deadline; retryable=false. Plaintext is never replayed.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control-No-Store'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: |
        IDEMPOTENCY_CONFLICT, STATE_CONFLICT, USAGE_EVENT_CONFLICT, ACK_CONFLICT,
        LEDGER_EPOCH_MISMATCH, ENROLLMENT_KEY_MISMATCH, DEVICE_LIMIT_REACHED,
        UPDATE_BUSY, AUTHORIZATION_EXPIRED, STALE_GENERATION, LEASE_EXPIRED,
        BOOTSTRAP_NOT_READY, NODE_INCARNATION_ACTIVE or NODE_RETIRED.
        Read the current state first; do not change the key to bypass a state
        conflict.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: RESOURCE_VERSION_CONFLICT. Re-read the resource; details.current_resource_version holds the current version.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: PAYLOAD_TOO_LARGE. Body or batch exceeds the configured limit.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnprocessableEntity:
      description: |
        VALIDATION_FAILED (details.fields lists fields), NODE_NOT_SERVICEABLE,
        RELEASE_NOT_APPROVED, SIGNATURE_INVALID, KEY_UNTRUSTED,
        UNSUPPORTED_PLATFORM, SCHEMA_INCOMPATIBLE, MINIMUM_VERSION_VIOLATION or
        METER_PATH_INVALID.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionRequired:
      description: PRECONDITION_REQUIRED. Send If-Match with the ETag last read.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: RATE_LIMITED. Honor Retry-After and back off with jitter.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: INTERNAL_ERROR. No internal detail is returned; quote the request_id.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: DEPENDENCY_UNAVAILABLE. Retry with the same Idempotency-Key. Events that were not persisted are never acknowledged.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/X-Request-ID'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    # ============================================================ errors
    ErrorEnvelope:
      type: object
      description: Error envelope (§14.6, AGENTS.md §4). Never contains stack traces, SQL, certificates or secrets.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required: [code, message, request_id, retryable, details]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 1000
          description: 'Safe, human-readable message (Admin: locatable; Member: understandable).'
        request_id:
          type: string
          format: uuid
          description: 'Central request ID, equal to the X-Request-ID response header.'
        retryable:
          type: boolean
          description: True when the same request with the same Idempotency-Key may succeed later.
        details:
          type: object
          description: |
            Machine-readable context, always an object (empty when there is none).
            Known members: `fields` (array of FieldError) for VALIDATION_FAILED,
            `current_resource_version` (decimal string) for
            RESOURCE_VERSION_CONFLICT, `current_ledger_epoch` (UUID) for
            LEDGER_EPOCH_MISMATCH, `header` for a missing required header.
          additionalProperties: true
    FieldError:
      type: object
      required: [field, reason]
      properties:
        field:
          type: string
          maxLength: 256
          description: JSON Pointer of the offending field, for example `/events/3/records/0/upload_bytes`.
        reason:
          type: string
          maxLength: 128
          description: Short machine-friendly reason, for example `decimal_string`, `required`, `enum`.
    ErrorCode:
      type: string
      description: |
        Stable error codes (§13.11, §14.6 and domain codes). The HTTP status and
        default retryable flag of each code are defined in `pkg/apierr`; the
        contracts tests keep this enum identical to that table. Codes marked
        node-local in `pkg/apierr` are reported mainly inside agent payloads
        (update results, observations). ARTIFACT_INVALID, ISOLATION_BASELINE_MISSING
        and METER_EPOCH_CHANGE are report-only and have no HTTP response status.
        NOT_IMPLEMENTED is transitional HTTP 501, retryable false; documented
        endpoints must not ship with it in a release.
      enum:
        - MALFORMED_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - CSRF_TOKEN_INVALID
        - RESOURCE_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - IDEMPOTENCY_CONFLICT
        - STATE_CONFLICT
        - RESOURCE_VERSION_CONFLICT
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_FAILED
        - NODE_NOT_SERVICEABLE
        - PRECONDITION_REQUIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - NOT_IMPLEMENTED
        - DEPENDENCY_UNAVAILABLE
        - RELEASE_NOT_APPROVED
        - UNSUPPORTED_PLATFORM
        - CONTROL_API_INCOMPATIBLE
        - SCHEMA_INCOMPATIBLE
        - SIGNATURE_INVALID
        - KEY_UNTRUSTED
        - HASH_MISMATCH
        - SIZE_MISMATCH
        - ARTIFACT_INVALID
        - DISK_SPACE_LOW
        - DOWNLOAD_TIMEOUT
        - STORE_UNAVAILABLE
        - UPDATE_BUSY
        - AUTHORIZATION_EXPIRED
        - STALE_GENERATION
        - IDENTITY_REVOKED
        - INCARNATION_MISMATCH
        - CHECKPOINT_FAILED
        - MIGRATION_FAILED
        - START_FAILED
        - HEALTH_CHECK_FAILED
        - MINIMUM_VERSION_VIOLATION
        - ROLLBACK_FAILED
        - ACK_CONFLICT
        - USAGE_EVENT_CONFLICT
        - LEDGER_EPOCH_MISMATCH
        - REPLAY_UNAVAILABLE
        - METER_PATH_INVALID
        - ISOLATION_BASELINE_MISSING
        - METER_EPOCH_CHANGE
        - DEVICE_LIMIT_REACHED
        - ENROLLMENT_TOKEN_INVALID
        - ENROLLMENT_TOKEN_EXPIRED
        - ENROLLMENT_TOKEN_REVOKED
        - ENROLLMENT_KEY_MISMATCH
        - LEASE_EXPIRED
        - WEBHOOK_SIGNATURE_INVALID
        - BOOTSTRAP_CONSUMED
        - BOOTSTRAP_NOT_READY
        - BOOTSTRAP_EXPIRED
        - NODE_INCARNATION_ACTIVE
        - NODE_RETIRED

    # ============================================================ common
    PeriodId:
      type: string
      description: Accounting period ID generated by the central service. V1 uses the UTC calendar month `YYYY-MM` (§10.4, pending business decision on the period type).
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
    LocalizedText:
      type: object
      description: User-facing text. zh-TW is the default UI language; English is second.
      required: [zh-TW]
      properties:
        zh-TW:
          type: string
          minLength: 1
          maxLength: 200
        en:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    ResourceType:
      type: string
      description: Kinds of resources referenced by operations and audit events.
      enum: [node, enrollment, exit, member, member_device, entitlement_grant, policy_definition, policy_revision, release, update_batch, update_target, checkout_session, fleet_config, admin_identity]
    ResourceRef:
      type: object
      required: [type, id]
      properties:
        type:
          $ref: '#/components/schemas/ResourceType'
        id:
          type: string
          format: uuid
    ReasonRequest:
      type: object
      description: A command that only needs an audited reason.
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Signature:
      type: object
      description: |
        One Ed25519 signature over the RFC 8785 canonical JSON of the envelope's
        `signed` object (§13.3, §16.2, `pkg/envelope`). Verifiers reject unknown
        algorithms, ignore unknown key_ids, and require at least one valid
        signature by a key trusted for the document's purpose.
      required: [key_id, algorithm, signature_b64]
      additionalProperties: false
      properties:
        key_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
        algorithm:
          type: string
          enum: [ed25519]
        signature_b64:
          type: string
          description: Standard padded base64 of the 64-byte signature.
          pattern: '^[A-Za-z0-9+/]{86}==$'
    Architecture:
      type: string
      description: Supported node CPU architectures (§3.2).
      enum: [amd64, arm64]
    RatePair:
      type: object
      description: Directional rate limits in bits per second, from the member's point of view (down = Internet to member).
      required: [down_bps, up_bps]
      additionalProperties: false
      properties:
        down_bps:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        up_bps:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991

    # ============================================================ §5 enums
    LifecycleState:
      type: string
      description: Whether the node identity is valid (§5).
      enum: [enrolling, registered, revoked, retired]
    ProvisioningState:
      type: string
      description: Whether local configuration is complete (§5).
      enum: [pending, applying, ready, failed]
    PublicationIntent:
      type: string
      description: The administrator's desired publication state (§5). Health, updates and reconnects never change it.
      enum: [unpublished, published, disabled]
    PublicationObserved:
      type: string
      description: Observed NetBird and node application state (§5).
      enum: [absent, applying, active, withdrawn, error]
    ControlStatus:
      type: string
      description: Agent to control-plane connectivity as observed by the center (§5).
      enum: [online, stale, offline]
    DataHealth:
      type: string
      description: Result of real data-path probes (§5).
      enum: [unknown, healthy, degraded, failed]
    SafetyStatus:
      type: string
      description: Whether isolation and a valid policy meet the baseline (§5).
      enum: [unknown, passed, failed, expired]
    UpdateJobState:
      type: string
      description: |
        State of one update job (§5, §13.2, §13.8). The §5 states plus
        `already_current` (verified no-op success, §13.6), `superseded_incarnation`
        (old incarnation's job after reinstall), `cancelled_revoked` and
        `cancelled_retired` (§13.1). Batch counts fold `superseded_incarnation`
        into `superseded` and both cancelled states into `cancelled`.
      enum: [queued, waiting_online, downloading, verifying, applying, checking, succeeded, already_current, failed, rolled_back, superseded, superseded_incarnation, cancelled_revoked, cancelled_retired]
    UpdateResultState:
      type: string
      description: |
        States an agent may report in an update result (§13.10.3). Terminal:
        succeeded, already_current, failed, rolled_back, superseded. `rolled_back`
        never counts as success of the target (§13.2).
      enum: [downloading, verifying, applying, checking, succeeded, already_current, failed, rolled_back, superseded]
    UpdateBatchState:
      type: string
      description: |
        Batch display state (§13.12): accepted (just created), waiting (some
        targets offline), running (targets in progress), completed (all terminal,
        no exceptions), completed_with_exceptions (all terminal with failed,
        rolled_back, cancelled or superseded targets).
      enum: [accepted, waiting, running, completed, completed_with_exceptions]
    HealthCheckStatus:
      type: string
      enum: [passed, failed, not_run]
    EntitlementState:
      type: string
      description: |
        Entitlement state (§9.2). Refunds are events, not states: a full or partial
        refund is recorded as a billing record and recomputes the state.
        `cancel_at_period_end` stays effective until the paid period ends;
        `past_due` and `grace` follow the defined, finite grace policy; `suspended`
        is an admin suspension that payments never lift.
      enum: [pending_payment, active, cancel_at_period_end, past_due, grace, expired, suspended, closed]
    PolicyType:
      type: string
      description: Versioned policy types of the generic policies API (§14.2).
      enum: [plan, fair_use, dns_profile, domain_rule_set, threat_feed, release_support]
    OperationStatus:
      type: string
      description: Generic operation status (§14.5). Update jobs use UpdateJobState.
      enum: [pending, running, succeeded, partially_succeeded, failed, superseded]
    OperationStepStatus:
      type: string
      description: Step status. Steps that are not needed are `not_required`, never null (§14.5).
      enum: [pending, running, succeeded, failed, not_required, cancelled]
    OperationKind:
      type: string
      enum:
        - node.enroll
        - node.update
        - node.publish
        - node.unpublish
        - node.disable
        - node.revoke
        - node.retire
        - member.update
        - member.suspend
        - member.unsuspend
        - member.grant
        - member.grant_revoke
        - member.device_authorize
        - member.device_revoke
        - policy.activate
        - release.register
        - update_batch.create
        - update_batch.retry
        - checkout.create

    # ============================================================ operations §14.5 §14.8
    Operation:
      type: object
      description: |
        Asynchronous operation (§14.5, §14.8). `succeeded` requires observed
        evidence for every required step. Desired and observed generations are
        separate fields.
      required: [operation_id, kind, status, resource, resource_version, desired_generation, observed_generation, steps, error, request_id, created_at, updated_at, completed_at]
      properties:
        operation_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/OperationKind'
        status:
          $ref: '#/components/schemas/OperationStatus'
        resource:
          $ref: '#/components/schemas/ResourceRef'
        resource_version:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          nullable: true
          description: 'Resource version written with the intent, when the target is a versioned resource.'
        desired_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          nullable: true
          description: 'Generation the operation must reach, when applicable.'
        observed_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          nullable: true
          description: 'Highest generation confirmed by observation so far.'
        steps:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/OperationStep'
        error:
          type: object
          nullable: true
          description: Final error of a failed or partially succeeded operation.
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              maxLength: 1000
        request_id:
          type: string
          format: uuid
          description: 'Request that created the operation.'
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        updated_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        completed_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
    OperationStep:
      type: object
      required: [name, status, required, observed_at, error_code, message]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: Step name, for example `agent_policy`, `netbird_route_readback`, `data_path_probe`.
        status:
          $ref: '#/components/schemas/OperationStepStatus'
        required:
          type: boolean
          description: Whether success of the operation requires this step.
        observed_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
          description: 'When the step''s current status was observed (read-back evidence).'
        error_code:
          type: string
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
          nullable: true
        message:
          type: string
          nullable: true
          maxLength: 1000

    # ============================================================ nodes §5 §14.2 §15.3
    ConfigGeneration:
      type: object
      description: Configuration generation requested by the center and the generation the node confirmed applying (§5).
      required: [desired, applied]
      properties:
        desired:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        applied:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          nullable: true
          description: 'Null until the node reports a successfully applied generation.'
    NodeReleases:
      type: object
      description: Actual, target and recoverable releases (§5, §13.2). current and last_good come only from reliable node reports.
      required: [current_release_id, desired_release_id, last_good_release_id]
      properties:
        current_release_id:
          type: string
          format: uuid
          nullable: true
        desired_release_id:
          type: string
          format: uuid
          nullable: true
        last_good_release_id:
          type: string
          format: uuid
          nullable: true
    NodeUpdateSummary:
      type: object
      description: The node's current update job, if any (§13.12).
      required: [batch_id, job_id, generation, state, last_result_at, last_observed_at, last_error_code]
      properties:
        batch_id:
          type: string
          format: uuid
          nullable: true
          description: 'Null for a fleet-default sync job that is not part of a batch (§13.1 step 5).'
        job_id:
          type: string
          format: uuid
        generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        state:
          $ref: '#/components/schemas/UpdateJobState'
        last_result_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        last_observed_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        last_error_code:
          type: string
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
          nullable: true
    NodeCapacity:
      type: object
      description: |
        Total VPN capacity of the node and the optional per-member cap
        (FUP04, §11.3). node capacity is the HTB parent; member caps are class
        ceilings, not guarantees.
      required: [down_bps, up_bps, member_down_bps_cap, member_up_bps_cap]
      additionalProperties: false
      properties:
        down_bps:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        up_bps:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        member_down_bps_cap:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          nullable: true
          description: 'node_member_rate_cap for the download direction; null means no node-specific member cap.'
        member_up_bps_cap:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          nullable: true
          description: 'node_member_rate_cap for the upload direction; null means no node-specific member cap.'
    NodePlatform:
      type: object
      required: [os, os_version, arch]
      properties:
        os:
          type: string
          enum: [ubuntu]
        os_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+$'
        arch:
          $ref: '#/components/schemas/Architecture'
    NodeSummary:
      type: object
      description: Node list row (§5, §18.1). Control, data path, policy validity and update completion are separate fields.
      required: [node_id, exit_id, name, region, member_group_ids, lifecycle_state, provisioning_state, publication_intent, publication_observed, control_status, data_health, safety_status, member_forwarding_observed, config_generation, releases, update, last_seen_at, resource_version, created_at]
      properties:
        node_id:
          type: string
          format: uuid
        exit_id:
          type: string
          format: uuid
          nullable: true
          description: 'V1 maps one exit to one node (§2).'
        name:
          type: string
          nullable: true
          maxLength: 100
        region:
          type: string
          nullable: true
          maxLength: 64
        member_group_ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        provisioning_state:
          $ref: '#/components/schemas/ProvisioningState'
        publication_intent:
          $ref: '#/components/schemas/PublicationIntent'
        publication_observed:
          $ref: '#/components/schemas/PublicationObserved'
        control_status:
          $ref: '#/components/schemas/ControlStatus'
        data_health:
          $ref: '#/components/schemas/DataHealth'
        safety_status:
          $ref: '#/components/schemas/SafetyStatus'
        member_forwarding_observed:
          type: boolean
          nullable: true
          description: Whether the node last reported member forwarding enabled. Null when never reported. An observation, not the intent.
        config_generation:
          $ref: '#/components/schemas/ConfigGeneration'
        releases:
          $ref: '#/components/schemas/NodeReleases'
        update:
          type: object
          allOf:
            - $ref: '#/components/schemas/NodeUpdateSummary'
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
          description: 'Central received_at of the last authenticated agent report.'
        resource_version:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    NodeDetail:
      description: Node detail (§14.2, §18.1) with desired versus observed differences.
      allOf:
        - $ref: '#/components/schemas/NodeSummary'
        - type: object
          required: [current_incarnation_id, platform, capacity, notes, netbird_peer_id, observed_exit_ipv4, observed_exit_ipv6, checks, recent_errors, drift, retired_at]
          properties:
            current_incarnation_id:
              type: string
              format: uuid
              nullable: true
            platform:
              type: object
              allOf:
                - $ref: '#/components/schemas/NodePlatform'
              nullable: true
            capacity:
              type: object
              allOf:
                - $ref: '#/components/schemas/NodeCapacity'
              nullable: true
            notes:
              type: string
              nullable: true
              maxLength: 2000
              description: Free-text notes, including source or owner remarks. Never used for permissions (NODE04).
            netbird_peer_id:
              type: string
              nullable: true
              maxLength: 128
              description: Opaque NetBird peer ID.
            observed_exit_ipv4:
              type: string
              format: ipv4
              nullable: true
            observed_exit_ipv6:
              type: string
              format: ipv6
              nullable: true
            checks:
              type: array
              maxItems: 32
              items:
                $ref: '#/components/schemas/NodeCheck'
            recent_errors:
              type: array
              maxItems: 50
              items:
                $ref: '#/components/schemas/NodeError'
            drift:
              type: array
              maxItems: 64
              description: Fields whose desired and observed values differ.
              items:
                $ref: '#/components/schemas/StateDrift'
            retired_at:
              type: string
              format: date-time
              pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
              nullable: true
    NodeCheck:
      type: object
      required: [name, status, observed_at, error_code]
      properties:
        name:
          type: string
          enum: [internet_only, source_binding, meter_path, qos, dns_policy, lease, policy_signature, release_supported, tunnel_probe, storage]
        status:
          $ref: '#/components/schemas/HealthCheckStatus'
        observed_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        error_code:
          type: string
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
          nullable: true
    NodeError:
      type: object
      required: [code, stage, message, observed_at]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        stage:
          type: string
          maxLength: 64
        message:
          type: string
          maxLength: 500
          description: Redacted summary; never tokens, keys, environment or browsing data (§13.11).
        observed_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    StateDrift:
      type: object
      required: [field, desired, observed]
      properties:
        field:
          type: string
          maxLength: 128
        desired:
          type: string
          nullable: true
          maxLength: 256
        observed:
          type: string
          nullable: true
          maxLength: 256
    NodeList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/NodeSummary'
        next_cursor:
          type: string
          nullable: true
          maxLength: 512
    NodePatch:
      type: object
      description: |
        Allowlisted node fields (§14.1). Only provided fields change; JSON null is
        never used. An empty `notes` string clears the notes; `clear_capacity:
        true` removes the capacity and cannot be combined with `capacity`.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        region:
          type: string
          minLength: 1
          maxLength: 64
        member_group_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        capacity:
          $ref: '#/components/schemas/NodeCapacity'
        clear_capacity:
          type: boolean
          enum: [true]
        notes:
          type: string
          maxLength: 2000
    PublicationRequest:
      type: object
      required: [publication_intent, reason]
      additionalProperties: false
      properties:
        publication_intent:
          $ref: '#/components/schemas/PublicationIntent'
        reason:
          type: string
          minLength: 1
          maxLength: 500

    # ============================================================ enrollments §6
    EnrollmentDelivery:
      type: string
      description: |
        How the token reaches the device (§6.4). `preinstalled`: written into one
        pre-installed box, longer shipping expiry (recommended default 7 days).
        `installer`: entered into the Ubuntu installer, short expiry (recommended
        default 15 minutes).
      enum: [preinstalled, installer]
    EnrollmentState:
      type: string
      enum: [pending, consumed, expired, revoked]
    EnrollmentCreateRequest:
      type: object
      required: [delivery]
      additionalProperties: false
      properties:
        node_id:
          type: string
          format: uuid
          description: Existing Node for authorized reinstallation (AT07). Previous incarnation must already be revoked and Node must not be retired; never clear revoked lifecycle. Omit to reserve a new Node.
        delivery:
          $ref: '#/components/schemas/EnrollmentDelivery'
        expires_in_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
          description: Token lifetime. Default depends on delivery (preinstalled 604800, installer 900; recommended defaults, configurable).
        name:
          type: string
          minLength: 1
          maxLength: 100
        region:
          type: string
          minLength: 1
          maxLength: 64
        member_group_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        notes:
          type: string
          maxLength: 2000
    Enrollment:
      type: object
      description: Enrollment without the token (§6.1, §15.3).
      required: [enrollment_id, node_id, delivery, state, expires_at, name, region, member_group_ids, notes, enrollment_request_id, node_incarnation_id, bound_public_key_sha256, created_at, consumed_at, revoked_at]
      properties:
        enrollment_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
          description: 'Node reserved for this enrollment.'
        delivery:
          $ref: '#/components/schemas/EnrollmentDelivery'
        state:
          $ref: '#/components/schemas/EnrollmentState'
        expires_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        name:
          type: string
          nullable: true
          maxLength: 100
        region:
          type: string
          nullable: true
          maxLength: 64
        member_group_ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        notes:
          type: string
          nullable: true
          maxLength: 2000
        enrollment_request_id:
          type: string
          format: uuid
          nullable: true
          description: 'Bound at first successful use.'
        node_incarnation_id:
          type: string
          format: uuid
          nullable: true
          description: 'Incarnation created by the enrollment.'
        bound_public_key_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          nullable: true
          description: 'SHA-256 of the DER SubjectPublicKeyInfo bound at first use.'
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        consumed_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        revoked_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
    EnrollmentCreated:
      type: object
      description: |
        Creation response (§14.5). `token` is present only in the first response;
        replays return `token: null` and `secret_available: false`. If the token
        was lost, revoke the enrollment and create a new one.
      required: [enrollment, token, secret_available]
      properties:
        enrollment:
          $ref: '#/components/schemas/Enrollment'
        token:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9_-]{43,128}$'
          description: One-time, high-entropy (at least 256 bits, base64url) enrollment token. Secret; never logged.
          x-fvpn-secret: true
        secret_available:
          type: boolean

    # ============================================================ members §9 §15.2
    PlanRef:
      type: object
      required: [plan_id, plan_revision_id, code, display_name]
      properties:
        plan_id:
          type: string
          format: uuid
          description: 'Plan policy definition ID.'
        plan_revision_id:
          type: string
          format: uuid
          description: 'Immutable plan revision the entitlement uses.'
        code:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
        display_name:
          $ref: '#/components/schemas/LocalizedText'
    EntitlementSummary:
      type: object
      description: |
        Computed entitlement (§9.2, §15.2). paid_through is the billing fact and is
        never rewritten by grace; effective_service_end is computed from the paid
        period, approved finite grants and the finite grace rule. Node forwarding
        deadlines (leases) are separate and never extend these values.
      required: [state, revision, plan, device_limit, valid_from, effective_service_end, paid_through, grace_until, cancel_at_period_end, admin_suspended, computed_at]
      properties:
        state:
          $ref: '#/components/schemas/EntitlementState'
        revision:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        plan:
          type: object
          allOf:
            - $ref: '#/components/schemas/PlanRef'
          nullable: true
        device_limit:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        valid_from:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        effective_service_end:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        paid_through:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        grace_until:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        cancel_at_period_end:
          type: boolean
        admin_suspended:
          type: boolean
        computed_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    SubscriptionSummary:
      type: object
      description: Provider subscription snapshot (§9.3). provider_status is the provider's opaque value.
      required: [provider, provider_status, paid_through, cancel_at_period_end, last_reconciled_at, reconciliation_status]
      properties:
        provider:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        provider_status:
          type: string
          maxLength: 64
        paid_through:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        cancel_at_period_end:
          type: boolean
        last_reconciled_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        reconciliation_status:
          type: string
          enum: [ok, pending, anomaly]
    UsageQualityFlags:
      type: object
      required: [estimated, gap, reconciliation_in_progress]
      properties:
        estimated:
          type: boolean
          description: Some bytes were split across a period boundary by time proportion (boundary_estimated, §10.9).
        gap:
          type: boolean
          description: Some data is known to be missing (§10.7).
        reconciliation_in_progress:
          type: boolean
          description: Aggregates are being rebuilt after a central restore (§10.8).
    MemberUsageSummary:
      type: object
      required: [period_id, total_bytes, aggregate_as_of, fair_use_tier_index, quality]
      properties:
        period_id:
          $ref: '#/components/schemas/PeriodId'
        total_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        aggregate_as_of:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        fair_use_tier_index:
          type: integer
          nullable: true
          minimum: 0
          maximum: 15
        quality:
          $ref: '#/components/schemas/UsageQualityFlags'
    MemberSummary:
      type: object
      required: [member_id, display_name, email, account_status, entitlement, authorized_device_count, usage, resource_version, created_at]
      properties:
        member_id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
          maxLength: 100
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
          description: Contact only; never an identity key (§2).
        account_status:
          type: string
          enum: [active, closed]
        entitlement:
          $ref: '#/components/schemas/EntitlementSummary'
        authorized_device_count:
          type: integer
          minimum: 0
          maximum: 1000
        usage:
          $ref: '#/components/schemas/MemberUsageSummary'
        resource_version:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    MemberDetail:
      description: Member detail (§14.2). Payment, admin suspension and effective period are separate.
      allOf:
        - $ref: '#/components/schemas/MemberSummary'
        - type: object
          required: [subscription, grants, member_group_ids, suspension, notes, closed_at]
          properties:
            subscription:
              type: object
              allOf:
                - $ref: '#/components/schemas/SubscriptionSummary'
              nullable: true
            grants:
              type: array
              maxItems: 200
              items:
                $ref: '#/components/schemas/EntitlementGrant'
            member_group_ids:
              type: array
              maxItems: 100
              items:
                type: string
                format: uuid
            suspension:
              type: object
              required: [suspended, reason, suspended_at, suspended_by]
              properties:
                suspended:
                  type: boolean
                reason:
                  type: string
                  nullable: true
                  maxLength: 500
                suspended_at:
                  type: string
                  format: date-time
                  pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
                  nullable: true
                suspended_by:
                  type: string
                  format: uuid
                  nullable: true
            notes:
              type: string
              nullable: true
              maxLength: 2000
            closed_at:
              type: string
              format: date-time
              pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
              nullable: true
    MemberList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MemberSummary'
        next_cursor:
          type: string
          nullable: true
          maxLength: 512
    MemberPatch:
      type: object
      description: |
        Allowlisted member fields; JSON null is never used. Setting
        `admin_suspended: true` requires
        `suspension_reason`. Suspension and unsuspension change the entitlement and
        return 202 with an operation.
      minProperties: 1
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        notes:
          type: string
          maxLength: 2000
          description: An empty string clears the notes.
        member_group_ids:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
