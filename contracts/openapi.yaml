          pattern: '^[0-9a-f]{64}$'
        reason:
          type: string
          maxLength: 500
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    DomainRuleSetPolicyRevision:
      type: object
      required: [type, revision_id, definition_id, revision, schema_version, payload, payload_sha256, reason, created_by, created_at]
      properties:
        type:
          type: string
          enum: [domain_rule_set]
        revision_id:
          type: string
          format: uuid
        definition_id:
          type: string
          format: uuid
        revision:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        schema_version:
          type: integer
          enum: [1]
        payload:
          description: |
            Admin domain rules (§12.4). Precedence: fixed isolation and member
            authorization, then `block` (forced deny), then `allow` (overrides threat
            and category lists only), then enabled lists, then normal resolution.
            Validation rejects duplicate rule_ids and two rules with the same
            (profile_id, domain, include_subdomains) — conflicting actions in the same
            layer are never resolved by last-write-wins.
            Owner JSON Schema snapshot at contracts/schemas/policies/domain-rule-set-payload.schema.json; see docs/contracts/README.md for limits. HTTP validation uses this OpenAPI component.
          allOf:
            - $ref: '#/components/schemas/DomainRuleSetPayload'
        payload_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        reason:
          type: string
          maxLength: 500
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    ThreatFeedPolicyRevision:
