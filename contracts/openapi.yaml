  # ---------------------------------------------------------------- agent
  /agent/enroll:
    post:
      operationId: enrollNode
      tags: [agent]
      summary: Enroll a node with a one-time token
      description: |
        First contact over HTTPS (no client certificate yet) with the one-time
        token in `Authorization: Enrollment <token>`, a PKCS#10 CSR and a
        proof-of-possession signature (§6.1, §14.7). The server binds the token to
        the public-key fingerprint atomically. A retry with the same
        enrollment_request_id, public key and valid proof returns the same
        incarnation with 200 (201 on first success); a different public key with
        the same token fails with 409 ENROLLMENT_KEY_MISMATCH (ENR02). A consumed
        token alone can never read the certificate back (§6.2). The NetBird
        bootstrap secret is not in this response; it is delivered later over mTLS
        via POST /agent/bootstrap (§14.7, D-015). If the enrollment is bound to
        an existing Node, create a new incarnation only after verifying that the
        previous incarnation is revoked and the Node is not retired (AT07);
        otherwise return NODE_INCARNATION_ACTIVE or NODE_RETIRED (409).
      x-fvpn-spec: '§14.4, §6.1, §6.2, §14.7'
      x-fvpn-requirements: [ENR01, ENR02, ENR03, ENR04]
      security:
        - enrollmentToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
      responses:
        '200':
          description: Retry of an already completed enrollment; same incarnation.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-No-Store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '201':
          description: Enrolled; certificate issued.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-No-Store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agent/bootstrap:
    post:
      operationId: consumeAgentBootstrap
      tags: [agent]
      summary: Consume the one-time NetBird bootstrap credential
      description: |
        D-015 (§6.4, §14.7): no request body. The verified agent mTLS certificate
        determines the Node and incarnation; no caller-supplied identity is used.
        The enrollment worker prepares a one-off NetBird setup key. This endpoint
        returns 200 once, atomically consuming its delivery. A later request,
        including one with the same Idempotency-Key, returns 410 BOOTSTRAP_CONSUMED;
        lost responses do not permit plaintext replay. Before preparation it
        returns 409 BOOTSTRAP_NOT_READY (retryable=true). After the delivery
        deadline, an unconsumed delivery returns 410 BOOTSTRAP_EXPIRED
        (retryable=false). Consumption takes precedence over expiry on retries.
        All responses use Cache-Control: no-store. Setup keys must never appear
        in enrollment responses, desired state, logs or audit payloads. The
        delivery deadline is separate from the enrollment token lifetime and
        NetBird's native setup-key expiry (§6.4).
      x-fvpn-spec: '§14.4, §6.4, §14.7, §16.2'
      x-fvpn-requirements: [ENR02, ENR03, SEC01]
      security: []
      x-fvpn-auth: agent-mtls
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      responses:
        '200':
          description: One-time bootstrap credential; delivery has been consumed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-No-Store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBootstrap'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/BootstrapNotReady'
        '410':
          $ref: '#/components/responses/BootstrapGone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /agent/certificates/renew:
    post:
      operationId: renewAgentCertificate
      tags: [agent]
      summary: Renew the agent certificate
      description: |
        Issues a new certificate for a valid machine identity and a new CSR
        (§6.4). Revoked identities cannot renew (403 IDENTITY_REVOKED). Retrying
        with the same renewal_request_id and CSR returns the same certificate.
      x-fvpn-spec: '§14.4, §6.4'
      x-fvpn-requirements: [SEC01, ENR03]
      security: []
      x-fvpn-auth: agent-mtls
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertificateRenewRequest'
      responses:
        '201':
          description: Certificate issued.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-No-Store'
