openapi: 3.0.3
info:
  title: Freedom VPN Control API
  version: 1.0.0
  description: |
    Contract for the Freedom VPN central control API (Project Spec v1.0, §14).
    There are 41 endpoints, including the D-015 agent bootstrap extension.
    This document is the single source of truth: Go types (`pkg/api`) and
    TypeScript types (`contracts/ts/schema.d.ts`) are generated from it, and the
    contract tests in `contracts/` validate every example against it.

    Conventions (§14.1, AGENTS.md §4):

    * All paths are relative to the `/api/v1` prefix. JSON is UTF-8.
    * Times are UTC RFC 3339 with `Z`. Intervals are half-open `[start, end)`.
    * Entity, operation and request IDs are UUID strings. External IDs
      (NetBird, OIDC, payment provider) are opaque strings.
    * Bytes, sequence numbers, generations, revisions and resource versions are
      JSON decimal strings matching `^(0|[1-9][0-9]*)$`, at most 20 digits and
      at most 18446744073709551615. They never pass through a float or a
      JavaScript Number (§10.4). Schema versions, attempts and bounded counts
      remain JSON integers (§13.10).
    * Money is `amount_minor` (int64, minor units) plus ISO 4217 `currency`.
    * Errors use the envelope `{"error": {"code", "message", "request_id",
      "retryable", "details"}}` (§14.6). Every response carries `X-Request-ID`.
    * Side-effecting admin and member commands require `Idempotency-Key`
      (§14.5). Mutable resources return `ETag` (`"<resource_version>"`) and
      modifications require `If-Match` (412 on mismatch, 428 when missing).
    * `201` means a local resource was durably created; `202` means an
      operation was accepted and its external or data-plane effect is still
      pending; `204` is used only for completed operations without a body.
      A 202 is never shown or reported as completed.
    * Desired state and observed state are always separate fields.
    * Lists use opaque `cursor` pagination; `limit` defaults to 50, maximum 100.

    Agent endpoints require mutual TLS with the node certificate issued at
    enrollment. OpenAPI 3.0 has no mutualTLS security scheme, so those
    operations declare `security: []` plus `x-fvpn-auth: agent-mtls`; see
    `x-fvpn-mutual-tls` below. They are never anonymous.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
x-fvpn-mutual-tls:
  scheme: agentMTLS
  description: |
    Agent mTLS (§14.1, §14.4, §16.1). The client presents the ECDSA P-256 node
    certificate issued by POST /agent/enroll or /agent/certificates/renew. The
    server derives node_id and node_incarnation_id from the verified
    certificate and the central binding, checks the incarnation and revocation
    state on every request, and treats node_id / node_incarnation_id in bodies
    only as consistency checks (mismatch: 403 INCARNATION_MISMATCH). Headers
    such as X-Node-ID or X-Client-Cert supplied by a client are never trusted.
x-fvpn-browser-auth:
  description: |
    Existing browser routes outside /api/v1 (D-032), excluded from the 41 API
    endpoints. There are no /api/v1/auth/session or /api/v1/auth/logout aliases.
  routes: ['GET /auth/session', 'POST /auth/logout']
  parameters:
    - name: role
      in: query
      required: false
      description: |
        Selects __Host-fvpn-admin or __Host-fvpn-member. Required only when both
        role cookies are present; ignored otherwise. Missing or invalid role
        with both cookies is MALFORMED_REQUEST. The selected session supplies
        the principal and logout CSRF context; a query never grants a role.
      schema:
        type: string
        enum: [admin, member]
servers:
  - url: https://control.example.invalid/api/v1
    description: Example deployment (placeholder host)
tags:
  - name: admin
    description: Administrator endpoints (§14.2). Session cookie, MFA enforced by the IdP; CSRF token on state changes.
  - name: member
    description: Member endpoints (§14.3). The member is always derived from the session, never from the request.
  - name: agent
    description: Node agent endpoints (§14.4). Agent mTLS except enrollment.
  - name: webhook
    description: Payment provider callbacks (§9.3, §14.4). Raw body plus provider signature.

paths:
  # ---------------------------------------------------------------- admin
  /admin/nodes:
    get:
      operationId: listNodes
      tags: [admin]
      summary: List nodes
      description: |
        Paginated nodes with classification, publication intent, observed state,
        versions and last report (§14.2, §18.1). The node source never affects the
        result (NODE04).
      x-fvpn-spec: '§14.2'
      x-fvpn-requirements: [NODE01, NODE02, NODE04]
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: lifecycle_state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/LifecycleState'
        - name: publication_intent
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PublicationIntent'
        - name: control_status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ControlStatus'
        - name: region
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: A page of nodes.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/enrollments:
    post:
      operationId: createEnrollment
      tags: [admin]
      summary: Create a single-node enrollment
      description: |
        Creates one enrollment with a reserved Node (§6.1, §18.2). The one-time
        token is returned only in the first response; the database stores only its
        hash. A retry with the same Idempotency-Key and payload returns the same
        enrollment with `secret_available=false` and `token=null` (§14.5). Creating
        an enrollment is the authorization to join; there is no further manual
        admission step (ENR01). Optional node_id authorizes reinstallation onto
        that existing Node (AT07). Its previous incarnation must already be
        revoked (409 NODE_INCARNATION_ACTIVE otherwise) and the Node must not be
        retired (409 NODE_RETIRED). Successful enrollment creates a new
        incarnation and retains Node history; never clear a revoked lifecycle
        to reuse an old incarnation. Without node_id, reserve a new Node.
      x-fvpn-spec: '§14.2, §6.1, §6.4, §14.5'
      x-fvpn-requirements: [ENR01, ENR03, NODE01]
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCreateRequest'
      responses:
        '201':
          description: Enrollment created (or replayed with secret_available=false).
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-No-Store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/enrollments/{enrollment_id}:
    get:
      operationId: getEnrollment
      tags: [admin]
      summary: Get an enrollment
      description: Expiry, binding and usage state. The raw token is never returned (§14.2).
      x-fvpn-spec: '§14.2'
      x-fvpn-requirements: [ENR01, ENR02]
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: The enrollment.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-No-Store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/enrollments/{enrollment_id}/revoke:
    post:
      operationId: revokeEnrollment
      tags: [admin]
      summary: Revoke an unused enrollment token
      description: |
        Revokes an unconsumed token (§6.4). Revoking a consumed enrollment fails
        with 409 STATE_CONFLICT; revoke the registered Node with
        POST /admin/nodes/{node_id}/revoke instead. Revoking an already revoked
        enrollment returns it unchanged.
      x-fvpn-spec: '§14.2, §6.4'
      x-fvpn-requirements: [ENR02]
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: The revoked enrollment.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/nodes/{node_id}:
    get:
      operationId: getNode
      tags: [admin]
      summary: Get node detail
      description: Aggregated node view with ETag, showing desired and observed state and their differences (§14.2, §15.3).
      x-fvpn-spec: '§14.2, §5'
      x-fvpn-requirements: [NODE02, EXIT01]
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: The node.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateNode
      tags: [admin]
      summary: Update node settings
      description: |
        Updates name, region, member groups, capacity or notes (§14.2). Returns 200
        with the node when only data changed, or 202 with an operation when the
        change must be applied as policy (for example capacity or member groups).
        Requires If-Match (§14.5). Never changes publication intent or observed
        state.
      x-fvpn-spec: '§14.2, §14.5'
      x-fvpn-requirements: [NODE03, FUP04, API01]
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodePatch'
      responses:
        '200':
          description: Data-only change stored.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeDetail'
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: retireNode
      tags: [admin]
      summary: Retire a node (tombstone)
      description: |
        Retires the node and keeps a tombstone (§5.2). Usage ledgers and audit are
        never cascade-deleted. Until all revocation steps are confirmed the
        operation shows them as pending.
      x-fvpn-spec: '§14.2, §5.2, §15.1'
      x-fvpn-requirements: [NODE03, DATA01]
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/nodes/{node_id}/publication:
    put:
      operationId: setNodePublication
      tags: [admin]
      summary: Set publication intent
      description: |
        Sets `published`, `unpublished` or `disabled` (§5.2). The intent, operation
        and audit are written in one transaction; the worker then confirms node
        isolation and policy ACK, applies NetBird routes and reads them back. The
        operation completes only after observed evidence. Publishing a node that is
        not ready fails with 422 NODE_NOT_SERVICEABLE. Disabling first removes
        member forwarding, then withdraws routes (EXIT03).
      x-fvpn-spec: '§14.2, §5.2'
      x-fvpn-requirements: [EXIT01, EXIT03, ENR04, NODE03]
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationRequest'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/nodes/{node_id}/revoke:
    post:
      operationId: revokeNode
      tags: [admin]
      summary: Revoke a node identity
      description: |
        Revokes the machine identity, exit routes, NetBird peer, agent certificate
        and unused enrollment tokens, keeping history (§5.2). Revocation is
        identity invalidation, different from disabling. A revoked identity never
        recovers through heartbeat or reinstall (§6.2).
      x-fvpn-spec: '§14.2, §5.2, §6.2'
      x-fvpn-requirements: [NODE03, SEC01]
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/members:
    get:
      operationId: listMembers
      tags: [admin]
      summary: List members
      description: Paginated accounts with plan, entitlement, device count and usage summary (§14.2, §18.1).
      x-fvpn-spec: '§14.2'
      x-fvpn-requirements: [MEM01, ENT01, MTR02]
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: entitlement_state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EntitlementState'
      responses:
        '200':
          description: A page of members.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-No-Store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/members/{member_id}:
    get:
      operationId: getMember
      tags: [admin]
      summary: Get member detail
      description: Member detail with ETag. Payment source, admin suspension and effective service period are separate fields (§9.2, §14.2).
      x-fvpn-spec: '§14.2, §9.2'
      x-fvpn-requirements: [MEM01, BILL02, ENT01]
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: The member.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-No-Store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateMember
      tags: [admin]
      summary: Update member or suspend
      description: |
        Updates allowed fields or the admin suspension (§9.2). Returns 200 for
        data-only changes and 202 with an operation when entitlement changes and
        policy must be synchronized. Admin suspension takes precedence over payment
        and later payments never lift it (§9.2). Requires If-Match.
      x-fvpn-spec: '§14.2, §9.2, §14.5'
      x-fvpn-requirements: [MEM03, BILL02, ENT02, API01]
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPatch'
      responses:
        '200':
          description: Data-only change stored.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control-No-Store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/members/{member_id}/grants:
    post:
      operationId: createMemberGrant
      tags: [admin]
      summary: Create a finite manual grant
      description: |
        Creates a time-limited manual entitlement grant (§9.2, §15.2). `valid_until`
        and `reason` are mandatory; unlimited trials are impossible. The operation
        resource is the new grant; entitlement recomputation and policy sync
        follow asynchronously.
      x-fvpn-spec: '§14.2, §9.2, §15.2'
      x-fvpn-requirements: [BILL02, ENT01]
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantCreateRequest'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
