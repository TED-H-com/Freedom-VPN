          allOf:
            - $ref: '#/components/schemas/ReleaseSupportPayload'
        payload_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        reason:
          type: string
          maxLength: 500
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'

    PlanPayload:
      type: object
