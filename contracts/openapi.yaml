        Plan revision payload (§14.2, §15.2 plans/plan_revisions). Prices, device
        limits and rates are pending business decisions (§21); the schema only
        carries them.
      required: [display_name, device_limit, exit_group_ids, price, rate_limit, fair_use_revision_id, dns_profile_revision_id]
