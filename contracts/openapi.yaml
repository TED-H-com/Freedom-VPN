    PolicyRevision:
      description: |
        One immutable policy revision; `type` selects the payload schema.
        The owner's JSON Schema 2020-12 payload snapshots are published under
        contracts/schemas/policies/ (plan, fair-use, dns-profile, domain-rule-set,
        threat-feed and release-support, each named <type>-payload.schema.json).
        See docs/contracts/README.md for provenance and known schema limitations;
        the OpenAPI payload component remains authoritative for HTTP bodies.
      oneOf:
        - $ref: '#/components/schemas/PlanPolicyRevision'
        - $ref: '#/components/schemas/FairUsePolicyRevision'
        - $ref: '#/components/schemas/DnsProfilePolicyRevision'
        - $ref: '#/components/schemas/DomainRuleSetPolicyRevision'
        - $ref: '#/components/schemas/ThreatFeedPolicyRevision'
        - $ref: '#/components/schemas/ReleaseSupportPolicyRevision'
      discriminator:
        propertyName: type
        mapping:
          plan: '#/components/schemas/PlanPolicyRevision'
          fair_use: '#/components/schemas/FairUsePolicyRevision'
          dns_profile: '#/components/schemas/DnsProfilePolicyRevision'
          domain_rule_set: '#/components/schemas/DomainRuleSetPolicyRevision'
          threat_feed: '#/components/schemas/ThreatFeedPolicyRevision'
          release_support: '#/components/schemas/ReleaseSupportPolicyRevision'
    PlanPolicyRevision:
      type: object
      required: [type, revision_id, definition_id, revision, schema_version, payload, payload_sha256, reason, created_by, created_at]
      properties:
        type:
          type: string
          enum: [plan]
        revision_id:
          type: string
          format: uuid
        definition_id:
          type: string
          format: uuid
        revision:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        schema_version:
          type: integer
          enum: [1]
        payload:
          description: |
            Plan revision payload (§14.2, §15.2 plans/plan_revisions). Prices, device
            limits and rates are pending business decisions (§21); the schema only
            carries them.
            Owner JSON Schema snapshot at contracts/schemas/policies/plan-payload.schema.json; see docs/contracts/README.md for limits. HTTP validation uses this OpenAPI component.
          allOf:
            - $ref: '#/components/schemas/PlanPayload'
        payload_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        reason:
          type: string
          maxLength: 500
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    FairUsePolicyRevision:
      type: object
      required: [type, revision_id, definition_id, revision, schema_version, payload, payload_sha256, reason, created_by, created_at]
      properties:
        type:
          type: string
          enum: [fair_use]
        revision_id:
          type: string
          format: uuid
        definition_id:
          type: string
          format: uuid
        revision:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        schema_version:
          type: integer
          enum: [1]
        payload:
          description: |
            Fair-use policy revision (§11.1). Thresholds and rates are pending
            business decisions; start in shadow mode.

            Validation rules enforced on create (§11.1):
            1. `tiers` is non-empty and `tiers[0].threshold_bytes` is "0", so tiers
               cover usage completely from zero with no gap.
            2. `threshold_bytes` is strictly increasing. Usage U is in tier i when
               tiers[i].threshold_bytes <= U < tiers[i+1].threshold_bytes; the last
               tier is unbounded above. U equal to a threshold enters that tier.
            3. Every tier has both `down_bps` and `up_bps`; all rates are
               non-negative integers.
            4. Rates are non-increasing and `priority` is non-decreasing from one
               tier to the next (a higher tier is never faster or more favored), so
               within one period the tier only stays or moves to a stricter one.
            5. Every tier rate is at least `minimum_rate` in each direction.
            6. Overrides have a finite `valid_until` in the future, a reason and an
               actor; at most one override per member.
            A missing tier is never treated as unlimited.
            Owner JSON Schema snapshot at contracts/schemas/policies/fair-use-payload.schema.json; see docs/contracts/README.md for limits. HTTP validation uses this OpenAPI component.
          allOf:
            - $ref: '#/components/schemas/FairUsePayload'
        payload_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        reason:
          type: string
          maxLength: 500
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    DnsProfilePolicyRevision:
      type: object
      required: [type, revision_id, definition_id, revision, schema_version, payload, payload_sha256, reason, created_by, created_at]
      properties:
        type:
          type: string
          enum: [dns_profile]
        revision_id:
          type: string
          format: uuid
        definition_id:
          type: string
          format: uuid
        revision:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        schema_version:
          type: integer
          enum: [1]
        payload:
          description: |
            DNS profile (§12.4, §12.5). References immutable domain_rule_set and
            threat_feed revisions. A profile can never relax the fixed IP-layer
            isolation baseline.
            Owner JSON Schema snapshot at contracts/schemas/policies/dns-profile-payload.schema.json; see docs/contracts/README.md for limits. HTTP validation uses this OpenAPI component.
          allOf:
            - $ref: '#/components/schemas/DnsProfilePayload'
