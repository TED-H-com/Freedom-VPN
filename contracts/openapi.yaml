          type: string
          format: uuid
          description: 'fair_use policy revision referenced by this plan.'
        dns_profile_revision_id:
          type: string
          format: uuid
          description: 'dns_profile policy revision referenced by this plan.'
    PlanPrice:
      type: object
      required: [amount_minor, currency, billing_interval, provider, provider_price_ref]
      additionalProperties: false
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Price in minor units of `currency` (§14.1). The currency defines the number of minor-unit digits.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code.
        billing_interval:
          type: string
          enum: [month, year]
        provider:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        provider_price_ref:
          type: string
          minLength: 1
          maxLength: 255
          description: Opaque provider price ID.

    FairUsePayload:
      type: object
      description: |
        Fair-use policy revision (§11.1). Thresholds and rates are pending
        business decisions; start in shadow mode.

        Validation rules enforced on create (§11.1):
        1. `tiers` is non-empty and `tiers[0].threshold_bytes` is "0", so tiers
           cover usage completely from zero with no gap.
        2. `threshold_bytes` is strictly increasing. Usage U is in tier i when
           tiers[i].threshold_bytes <= U < tiers[i+1].threshold_bytes; the last
           tier is unbounded above. U equal to a threshold enters that tier.
        3. Every tier has both `down_bps` and `up_bps`; all rates are
           non-negative integers.
        4. Rates are non-increasing and `priority` is non-decreasing from one
           tier to the next (a higher tier is never faster or more favored), so
           within one period the tier only stays or moves to a stricter one.
        5. Every tier rate is at least `minimum_rate` in each direction.
        6. Overrides have a finite `valid_until` in the future, a reason and an
           actor; at most one override per member.
        A missing tier is never treated as unlimited.
      required: [mode, effective_at, effective_period, accounting_basis, tiers, minimum_rate, overrides]
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [shadow, enforce]
          description: shadow records would_apply_tier only and never shapes; enforce generates member policy generations (§11.2).
        effective_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          description: 'When this revision''s mode takes effect. Shadow results are never reported as throttling.'
        effective_period:
          type: string
          enum: [next_full_period, immediate]
          default: next_full_period
          description: Recommended default next_full_period; immediate is an explicit emergency adjustment (§11.1).
        accounting_basis:
          type: object
          required: [period_type, metering_version, measure]
          additionalProperties: false
          properties:
            period_type:
              type: string
              enum: [utc_calendar_month]
              description: Accounting period type (recommended default UTC calendar month; pending decision, §10.4).
            metering_version:
              $ref: '#/components/schemas/MeteringVersion'
            measure:
              type: string
              enum: [total_bytes]
              description: upload_bytes plus download_bytes (§11.1).
        tiers:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/FairUseTier'
        minimum_rate:
          allOf:
            - $ref: '#/components/schemas/RatePair'
          description: Basic usable rate floor (§11.1); the formal value is a pending decision.
        overrides:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/FairUseOverride'
    FairUseTier:
      type: object
      required: [threshold_bytes, down_bps, up_bps, priority, display_name]
      additionalProperties: false
      properties:
        threshold_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Inclusive lower bound of the tier in total bytes for the period.'
        down_bps:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        up_bps:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        priority:
          type: integer
          minimum: 0
          maximum: 7
          description: HTB priority, 0 is most favored.
        display_name:
          $ref: '#/components/schemas/LocalizedText'
    FairUseOverride:
      type: object
      description: Time-limited, audited member override (§11.1).
      required: [member_id, down_bps, up_bps, priority, valid_until, reason, actor_id]
      additionalProperties: false
      properties:
        member_id:
          type: string
          format: uuid
        down_bps:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        up_bps:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        priority:
          type: integer
          minimum: 0
          maximum: 7
        valid_until:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        actor_id:
          type: string
          format: uuid

    DnsProfilePayload:
      type: object
      description: |
        DNS profile (§12.4, §12.5). References immutable domain_rule_set and
        threat_feed revisions. A profile can never relax the fixed IP-layer
        isolation baseline.
      required: [profile_code, display_name, domain_rule_set_revision_ids, threat_feed_revision_ids, block_response, blocked_ttl_seconds]
      additionalProperties: false
      properties:
        profile_code:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          description: Profile identifier used by domain rules (for example `standard`).
        display_name:
          $ref: '#/components/schemas/LocalizedText'
        domain_rule_set_revision_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        threat_feed_revision_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        block_response:
          type: string
          enum: [nxdomain, refused, null_address]
          default: nxdomain
          description: Recommended default NXDOMAIN (§12.5).
        blocked_ttl_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: TTL of blocked responses. Short adjustable start value; production value is a pending decision (§12.5), so it has no default here.
    DomainRuleSetPayload:
      type: object
      description: |
        Admin domain rules (§12.4). Precedence: fixed isolation and member
        authorization, then `block` (forced deny), then `allow` (overrides threat
        and category lists only), then enabled lists, then normal resolution.
        Validation rejects duplicate rule_ids and two rules with the same
        (profile_id, domain, include_subdomains) — conflicting actions in the same
        layer are never resolved by last-write-wins.
      required: [rules]
      additionalProperties: false
      properties:
        rules:
          type: array
          maxItems: 100000
          items:
            $ref: '#/components/schemas/DomainRule'
    DomainRule:
      type: object
      description: |
        One domain rule (§12.4). `domain` is the canonical ASCII form after
        Unicode/IDNA validation and normalization, lowercase, without the trailing
        root dot, scheme, port, path, query, fragment, user info or wildcards.
        include_subdomains=true matches the apex and every subdomain on a full
        label boundary (example.com never matches notexample.com); false matches
        the exact name only.
      required: [rule_id, profile_id, domain, include_subdomains, action, reason, revision]
      additionalProperties: false
      properties:
        rule_id:
          type: string
          format: uuid
        profile_id:
          type: string
          nullable: true
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          description: profile_code the rule applies to; null applies the rule to every profile (service-wide).
        domain:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)*[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
        include_subdomains:
          type: boolean
        action:
          type: string
          enum: [block, allow]
        reason:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: Reason code, for example `admin_rule` or `false_positive`.
        revision:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Revision of this rule.'
    ThreatFeedPayload:
      type: object
      description: |
        Threat or category feed source with license basis (§12.3, §14.2). A feed
        whose commercial use is not confirmed must not be placed in a production
        profile. Fetch times and results are observations stored separately.
      required: [provider, feed_code, license_name, license_url, commercial_use_basis, attribution, source_url, format, categories, content_sha256, max_size_bytes, valid_from, valid_until, update_interval_seconds]
      additionalProperties: false
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 100
        feed_code:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
        license_name:
          type: string
          minLength: 1
          maxLength: 200
        license_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
        commercial_use_basis:
          type: string
          minLength: 1
          maxLength: 1000
          description: Why commercial use and redistribution are allowed.
        attribution:
          type: string
          nullable: true
          maxLength: 1000
        source_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Fixed trusted HTTPS source; arbitrary fetch URLs are not accepted (§12.3, §16.2).
        format:
          type: string
          enum: [domain_list, hosts, adblock]
        categories:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [malware, phishing, ads, family]
        content_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 'Digest of the approved content snapshot.'
        max_size_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Maximum accepted download size.'
        valid_from:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        valid_until:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        update_interval_seconds:
          type: integer
          minimum: 300
          maximum: 604800
          description: Refresh interval. Pending decision per source (§12.3); required, no default.
    ReleaseSupportPayload:
      type: object
      description: |
        Approved, revoked and minimum-serving releases (§13.2, §14.2).
        Validation: approved_release_ids is a subset of
        minimum_serving_version.serving_release_ids; revoked_release_ids is
        disjoint from both. A normal update never raises the minimum serving set
        implicitly; changing it is an explicit, audited policy change whose effect
        (nodes may stop serving) the UI must show.
      required: [approved_release_ids, revoked_release_ids, minimum_serving_version]
      additionalProperties: false
      properties:
        approved_release_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          description: Releases that may be new update targets (otherwise RELEASE_NOT_APPROVED).
          items:
            type: string
            format: uuid
        revoked_release_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          description: Releases that may never be targets or serve.
          items:
            type: string
            format: uuid
        minimum_serving_version:
          type: object
          description: |
            Minimum serving threshold as an allowlist of release IDs (§13.2). Never
            decided by lexical comparison of version strings.
          required: [serving_release_ids]
          additionalProperties: false
          properties:
            serving_release_ids:
              type: array
              minItems: 1
              maxItems: 1000
              uniqueItems: true
              items:
                type: string
                format: uuid

    # ============================================================ releases §13.2 §13.3
    ReleaseManifestEnvelope:
      type: object
      description: |
        Signed release manifest (§13.3). Signed with a `release` purpose key; nodes
        hold only trusted public keys and verify before any install. Transport
        location, HTTP success or TLS never replace signature verification.
      required: [signed, signatures]
      additionalProperties: false
      properties:
        signed:
          $ref: '#/components/schemas/ReleaseManifest'
        signatures:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/Signature'
    ReleaseManifest:
      type: object
      description: |
        Immutable manifest of one release (§13.3). The manifest, packages and
        SHA-256 of a release_id are never overwritten; any change creates a new
        release_id. `release_sequence` never replaces the authorized
        update_generation. Artifacts must include at least the selected Ubuntu
        baseline for both amd64 and arm64, otherwise the release can never target
        all_nodes (§13.4).
      required: [manifest_schema_version, release_id, product_version, release_sequence, created_at, source_commit, build_id, components, compatibility, artifacts, rollback, evidence]
      additionalProperties: false
      properties:
        manifest_schema_version:
          type: integer
          enum: [1]
        release_id:
          type: string
          format: uuid
        product_version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          maxLength: 64
          description: Human-readable version for display only; security decisions use release_id, hashes and allowlists.
        release_sequence:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        source_commit:
          type: string
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
          description: Git commit (SHA-1 or SHA-256 object name).
        build_id:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
        components:
          $ref: '#/components/schemas/ManifestComponents'
        compatibility:
          $ref: '#/components/schemas/ManifestCompatibility'
        artifacts:
          type: array
          minItems: 2
          maxItems: 16
          items:
            $ref: '#/components/schemas/ManifestArtifact'
        rollback:
          $ref: '#/components/schemas/ManifestRollback'
        evidence:
          $ref: '#/components/schemas/ManifestEvidence'
    ComponentVersion:
      type: string
      pattern: '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$'
      description: Exact pinned component version (never `latest`).
    ManifestComponents:
      type: object
      required: [node_agent, node_updater, netbird, enforcement]
      additionalProperties: false
      properties:
        node_agent:
          $ref: '#/components/schemas/ComponentVersion'
        node_updater:
          $ref: '#/components/schemas/ComponentVersion'
        netbird:
          $ref: '#/components/schemas/ComponentVersion'
        enforcement:
          $ref: '#/components/schemas/ComponentVersion'
    ManifestCompatibility:
      type: object
      required: [control_api_major, policy_schema_versions, usage_event_schema_versions, minimum_updater_version, state_schema_from, state_schema_to, migration_id, requires_service_restart]
      additionalProperties: false
      properties:
        control_api_major:
          type: integer
          minimum: 1
          maximum: 1000
        policy_schema_versions:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 1000
        usage_event_schema_versions:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 1000
        minimum_updater_version:
          $ref: '#/components/schemas/ComponentVersion'
        state_schema_from:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          description: Local state schema versions this release can migrate from.
          items:
            type: integer
            minimum: 1
            maximum: 1000
        state_schema_to:
          type: integer
          minimum: 1
          maximum: 1000
        migration_id:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'
        requires_service_restart:
          type: boolean
    ManifestArtifact:
      type: object
      required: [os_id, os_versions, architecture, format, url, size_bytes, installed_size_bytes, sha256]
      additionalProperties: false
      properties:
        os_id:
          type: string
          enum: [ubuntu]
        os_versions:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: '^[0-9]+\.[0-9]+$'
        architecture:
          $ref: '#/components/schemas/Architecture'
        format:
          type: string
          enum: [tar.zst]
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Transport location only; content is trusted only after the manifest signature and sha256 verify.
        size_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        installed_size_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ManifestRollback:
      type: object
      required: [allowed_release_ids, state_readable_by_previous, required_free_bytes, health_profile]
      additionalProperties: false
      properties:
        allowed_release_ids:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            format: uuid
        state_readable_by_previous:
          type: boolean
          description: False forbids direct rollback; the preflight rejects that path (§13.7).
        required_free_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Disk reserve required before a destructive apply (§13.3 rollback conditions).'
        health_profile:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    ManifestEvidence:
      type: object
      required: [sbom_url, sbom_sha256, notices_url, source_url]
      additionalProperties: false
      properties:
        sbom_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
        sbom_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        notices_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
        source_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
    ReleaseRegisterRequest:
      type: object
      required: [manifest, manifest_url]
      additionalProperties: false
      properties:
        manifest:
          $ref: '#/components/schemas/ReleaseManifestEnvelope'
        manifest_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Location of the manifest in an allowlisted release store (§16.2). Member-supplied locations are never accepted.
    Release:
      type: object
      description: Registered release as seen by administrators (§13.2, §14.2).
      required: [release_id, product_version, release_sequence, manifest_sha256, manifest_created_at, registered_at, verification_state, verification_error, support_state, serving_allowed, is_fleet_default, architectures, artifacts, components, compatibility, signing_key_ids]
      properties:
        release_id:
          type: string
          format: uuid
        product_version:
          type: string
          maxLength: 64
        release_sequence:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 'SHA-256 of the canonical JSON of the whole manifest envelope.'
        manifest_created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        registered_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        verification_state:
          type: string
          enum: [verifying, verified, rejected]
        verification_error:
          type: string
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
          nullable: true
        support_state:
          type: string
          enum: [approved, not_approved, revoked]
          description: From the active release_support policy.
        serving_allowed:
          type: boolean
          description: Whether the release is in the minimum serving set.
        is_fleet_default:
          type: boolean
        architectures:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/Architecture'
        artifacts:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/ManifestArtifact'
        components:
          $ref: '#/components/schemas/ManifestComponents'
        compatibility:
          $ref: '#/components/schemas/ManifestCompatibility'
        signing_key_ids:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 128
    FleetReleaseState:
      type: object
      description: Fleet target and serving policy (§13.2, §15.4 fleet_config). Target version and minimum serving set are separate (UPD04).
      required: [fleet_default_release_id, generation, release_support_revision_id, serving_release_ids, resource_version]
      properties:
        fleet_default_release_id:
          type: string
          format: uuid
          nullable: true
        generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Fleet generation; pass it as expected_generation when creating a batch.'
        release_support_revision_id:
          type: string
          format: uuid
          nullable: true
        serving_release_ids:
          type: array
          maxItems: 1000
          items:
            type: string
            format: uuid
        resource_version:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
    ReleaseList:
      type: object
      required: [items, next_cursor, fleet]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Release'
        next_cursor:
          type: string
          nullable: true
          maxLength: 512
        fleet:
          $ref: '#/components/schemas/FleetReleaseState'

    # ============================================================ update batches §13.1 §13.10
    UpdateBatchCreateRequest:
      type: object
      required: [release_id, scope, expected_generation, set_fleet_default, reason]
      additionalProperties: false
      properties:
        release_id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [all_nodes]
        expected_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Current fleet generation; mismatch returns 409 STATE_CONFLICT (§14.5).'
        set_fleet_default:
          type: boolean
          enum: [true]
          description: Always true for all_nodes; there is no hidden option that lets new nodes drift (§13.10.1).
        reason:
          type: string
          minLength: 1
          maxLength: 500
    UpdateBatchAccepted:
      type: object
      description: |
        202 response (§13.10.1). target_count is fixed by the creating transaction
        and never changes when nodes are added later.
      required: [batch_id, operation_id, state, release_id, target_count, online_at_snapshot, offline_at_snapshot, fleet_default_release_id, fleet_generation, created_at, status_url]
      properties:
        batch_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [accepted]
        release_id:
          type: string
          format: uuid
        target_count:
          type: integer
          minimum: 0
          maximum: 1000000
        online_at_snapshot:
          type: integer
          minimum: 0
          maximum: 1000000
        offline_at_snapshot:
          type: integer
          minimum: 0
          maximum: 1000000
        fleet_default_release_id:
          type: string
          format: uuid
        fleet_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'New fleet generation written by this batch.'
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        status_url:
          type: string
          pattern: '^/api/v1/admin/update-batches/[0-9a-f-]{36}$'
    UpdateBatchCounts:
      type: object
      description: Mutually exclusive counts; their sum equals target_count (§13.12). Success is succeeded plus already_current.
      required: [queued, waiting_online, downloading, verifying, applying, checking, succeeded, already_current, failed, rolled_back, superseded, cancelled]
      properties:
        queued:
          type: integer
          minimum: 0
          maximum: 1000000
        waiting_online:
          type: integer
          minimum: 0
          maximum: 1000000
        downloading:
          type: integer
          minimum: 0
          maximum: 1000000
        verifying:
          type: integer
          minimum: 0
          maximum: 1000000
        applying:
          type: integer
          minimum: 0
          maximum: 1000000
        checking:
          type: integer
          minimum: 0
          maximum: 1000000
        succeeded:
          type: integer
          minimum: 0
          maximum: 1000000
        already_current:
          type: integer
          minimum: 0
          maximum: 1000000
        failed:
          type: integer
          minimum: 0
          maximum: 1000000
        rolled_back:
          type: integer
          minimum: 0
          maximum: 1000000
        superseded:
          type: integer
          minimum: 0
          maximum: 1000000
        cancelled:
          type: integer
          minimum: 0
          maximum: 1000000
    UpdateBatch:
      type: object
      description: |
        Batch progress (§13.10.4). `targets` is one cursor page; `next_cursor`
        continues it with GET on this resource. `targets_url` is the first page.
      required: [batch_id, operation_id, release_id, state, target_count, counts, requires_service_restart, reason, created_by, created_at, updated_at, targets_url, targets, next_cursor]
      properties:
        batch_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        release_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/UpdateBatchState'
        target_count:
          type: integer
          minimum: 0
          maximum: 1000000
        counts:
          $ref: '#/components/schemas/UpdateBatchCounts'
        requires_service_restart:
          type: boolean
          description: Shown at submission so admins know nodes may restart together (§13.12).
        reason:
          type: string
          maxLength: 500
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        updated_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        targets_url:
          type: string
          pattern: '^/api/v1/admin/update-batches/[0-9a-f-]{36}$'
        targets:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/UpdateTarget'
        next_cursor:
          type: string
          nullable: true
          maxLength: 512
    UpdateTarget:
      type: object
      description: One node of the batch snapshot (§15.4 update_targets). incarnation_at_snapshot is immutable; execution_incarnation_id binds once.
      required: [target_id, node_id, node_name, incarnation_at_snapshot, execution_incarnation_id, online_at_snapshot, generation, state, attempts, current_job, current_release_id, last_result_at, last_observed_at, retryable, needs_attention, unconfirmed]
      properties:
        target_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        node_name:
          type: string
          nullable: true
          maxLength: 100
        incarnation_at_snapshot:
          type: string
          format: uuid
          nullable: true
          description: 'Null for nodes that had not finished enrollment at snapshot time.'
        execution_incarnation_id:
          type: string
          format: uuid
          nullable: true
        online_at_snapshot:
          type: boolean
        generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        state:
          $ref: '#/components/schemas/UpdateJobState'
        attempts:
          type: integer
          minimum: 0
          maximum: 1000
        current_job:
          type: object
          allOf:
            - $ref: '#/components/schemas/UpdateJobSummary'
          nullable: true
        current_release_id:
          type: string
          format: uuid
          nullable: true
          description: 'Last observed actual release (not the requested one).'
        last_result_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        last_observed_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        retryable:
          type: boolean
        needs_attention:
          type: boolean
          description: Central side has flagged this target for operator attention.
        unconfirmed:
          type: boolean
          description: The node has not confirmed the last issued job.
    UpdateJobSummary:
      type: object
      required: [job_id, attempt, state, stage, error_code, recovery_required, started_at, finished_at]
      properties:
        job_id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
          maximum: 1000
        state:
          $ref: '#/components/schemas/UpdateJobState'
        stage:
          type: string
          allOf:
            - $ref: '#/components/schemas/UpdateStage'
          nullable: true
        error_code:
          type: string
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
          nullable: true
        recovery_required:
          type: boolean
          x-go-type: nullable.Required[bool]
          x-go-type-import:
            path: github.com/TED-H-com/Freedom-VPN/pkg/api/presence
            name: nullable
        started_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        finished_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
    UpdateStage:
      type: string
      description: Updater stage where a result or error happened (§13.6, §13.11).
      enum: [claim, download, verify, preflight, prepare, block_forwarding, final_sample, stop_services, migrate, switch, start, check, commit, rollback, report]
    UpdateBatchRetryRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        target_ids:
          type: array
          minItems: 1
          maxItems: 10000
          uniqueItems: true
          description: Targets to retry; omit to retry every retryable failed target.
          items:
            type: string
            format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 500

    # ============================================================ audit §16.4
    AuditEvent:
      type: object
      description: Redacted audit event (§9.1, §16.4). Configuration history, never member browsing history.
      required: [audit_event_id, occurred_at, actor, action, resource, request_id, operation_id, result, changes]
      properties:
        audit_event_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        actor:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              enum: [admin, member, node, system]
            id:
              type: string
              format: uuid
              nullable: true
        action:
          type: string
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
          maxLength: 128
          description: Dotted action name, for example `node.publish`.
        resource:
          $ref: '#/components/schemas/ResourceRef'
        request_id:
          type: string
          format: uuid
          nullable: true
        operation_id:
          type: string
          format: uuid
          nullable: true
        result:
          type: string
          enum: [succeeded, failed, denied]
        changes:
          type: object
          description: Redacted before/after differences. Never secrets, tokens or full payment payloads.
          required: [before, after]
          properties:
            before:
              type: object
              nullable: true
              additionalProperties: true
            after:
              type: object
              nullable: true
              additionalProperties: true
    AuditEventList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
          nullable: true
          maxLength: 512

    # ============================================================ member area §14.3 §18.4
    NextAction:
      type: string
      description: What the member should do next (§14.3, §18.4).
      enum: [complete_payment, wait_for_payment_confirmation, install_app, register_device, free_device_slot, renew_subscription, contact_support]
    MemberSelf:
      type: object
      required: [member_id, display_name, email, entitlement, subscription, limits, fair_use_reset_at, next_actions]
      properties:
        member_id:
          type: string
          format: uuid
        display_name:
          type: string
          nullable: true
          maxLength: 100
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        entitlement:
          $ref: '#/components/schemas/EntitlementSummary'
        subscription:
          type: object
          allOf:
            - $ref: '#/components/schemas/SubscriptionSummary'
          nullable: true
        limits:
          type: object
          required: [device_limit, authorized_device_count, exit_count]
          properties:
            device_limit:
              type: integer
              nullable: true
              minimum: 0
              maximum: 100
            authorized_device_count:
              type: integer
              minimum: 0
              maximum: 1000
            exit_count:
              type: integer
              minimum: 0
              maximum: 10000
        fair_use_reset_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
          description: 'Start of the next accounting period (UTC), shown in the member''s time zone by the UI.'
        next_actions:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/NextAction'
    DeviceStatus:
      type: string
      description: Member device authorization state (§9.4). New peers start without exit rights.
      enum: [pending, authorized, rejected_over_limit, revoked]
    MemberDevice:
      type: object
      required: [device_id, name, platform, status, authorized_at, revoked_at, last_seen_at, created_at]
      properties:
        device_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        platform:
          type: string
          enum: [windows, macos, ios, android, linux, unknown]
        status:
          $ref: '#/components/schemas/DeviceStatus'
        authorized_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        revoked_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        created_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    MemberDeviceList:
      type: object
      required: [items, next_cursor, device_limit, authorized_count]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MemberDevice'
        next_cursor:
          type: string
          nullable: true
          maxLength: 512
        device_limit:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        authorized_count:
          type: integer
          minimum: 0
          maximum: 1000
    MemberExit:
      type: object
      description: Exit the member may select in the app (§18.4). The portal never switches the app's exit.
      required: [exit_id, display_name, region, availability, note]
      properties:
        exit_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 100
        region:
          type: string
          maxLength: 64
        availability:
          type: string
          enum: [available, temporarily_unavailable]
        note:
          type: object
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          nullable: true
    MemberExitList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MemberExit'
        next_cursor:
          type: string
          nullable: true
          maxLength: 512
    UsageTotals:
      type: object
      required: [upload_bytes, download_bytes, total_bytes]
      properties:
        upload_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        download_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        total_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'upload_bytes plus download_bytes, computed with checked integer arithmetic.'
    UsageDay:
      type: object
      required: [date, upload_bytes, download_bytes, total_bytes, quality]
      properties:
        date:
          type: string
          format: date
          description: UTC calendar day.
        upload_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        download_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        total_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        quality:
          $ref: '#/components/schemas/UsageQualityFlags'
    FairUseStatus:
      type: object
      description: |
        Member-visible speed state (FUP03, §11.6). Shadow-mode results are never
        shown as throttling. `applying` is true while some nodes have not yet
        acknowledged the member's current policy generation.
      required: [state, tier_index, tier_name, rate, reason, applying, resets_at, as_of]
      properties:
        state:
          type: string
          enum: [normal, adjusted]
        tier_index:
          type: integer
          nullable: true
          minimum: 0
          maximum: 15
        tier_name:
          type: object
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          nullable: true
        rate:
          type: object
          allOf:
            - $ref: '#/components/schemas/RatePair'
          nullable: true
          description: Upper rate per exit (rate scope is member and exit, §11.3); not a guaranteed speed.
        reason:
          type: string
          nullable: true
          enum: [fair_use_tier, admin_override]
        applying:
          type: boolean
        resets_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
          description: 'Next recovery time (start of the next period or override end).'
        as_of:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
          description: 'Ledger watermark time the tier was computed from.'
    MemberUsage:
      type: object
      description: Recorded VPN usage (forward_admission_v1) for one accounting period (§10.9, §11.6).
      required: [period_id, period_start, period_end, granularity, metering_version, totals, quality, last_observed_at, aggregate_as_of, days, fair_use]
      properties:
        period_id:
          $ref: '#/components/schemas/PeriodId'
        period_start:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          description: 'Inclusive.'
        period_end:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          description: 'Exclusive.'
        granularity:
          type: string
          enum: [month, day]
        metering_version:
          $ref: '#/components/schemas/MeteringVersion'
        totals:
          $ref: '#/components/schemas/UsageTotals'
        quality:
          $ref: '#/components/schemas/UsageQualityFlags'
        last_observed_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        aggregate_as_of:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
          description: 'Aggregation watermark; never presented as real time (§10.6).'
        days:
          type: array
          maxItems: 31
          description: Per-day rows for granularity=day; empty for month.
          items:
            $ref: '#/components/schemas/UsageDay'
        fair_use:
          $ref: '#/components/schemas/FairUseStatus'
    CheckoutSessionRequest:
      type: object
      required: [plan_id, return_url]
      additionalProperties: false
      properties:
        plan_id:
          type: string
          format: uuid
          description: 'Plan definition offered to the member.'
        return_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Must match the server-side return URL allowlist (§16.2).
    CheckoutSession:
      type: object
      required: [checkout_session_id, provider, checkout_url, expires_at]
      properties:
        checkout_session_id:
          type: string
          format: uuid
        provider:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,31}$'
        checkout_url:
          type: string
          format: uri
          maxLength: 2048
        expires_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    BillingPortalSessionRequest:
      type: object
      required: [return_url]
      additionalProperties: false
      properties:
        return_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Must match the server-side return URL allowlist (§16.2).
    BillingPortalSession:
      type: object
      required: [portal_url, expires_at]
      properties:
        portal_url:
          type: string
          format: uri
          maxLength: 2048
        expires_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'

    # ============================================================ agent: enrollment §6 §14.7
    EnrollRequest:
      type: object
      description: |
        Enrollment request (§14.7). The token is only in the Authorization header.
        `proof` is the proof of possession: standard base64 of the ASN.1 DER
        ECDSA P-256 SHA-256 signature, made with the node private key whose public
        key is in `csr_pem`, over the RFC 8785 canonical JSON of this request
        object without the `proof` member. The server verifies the CSR
        self-signature and the proof; a claimed fingerprint alone is never
        accepted.
      required: [enrollment_request_id, node_incarnation_id, csr_pem, proof, platform, agent_release]
      additionalProperties: false
      properties:
        enrollment_request_id:
          type: string
          format: uuid
          description: 'Stable request ID generated on first boot and reused on every retry (§6.1, §6.2).'
        node_incarnation_id:
          type: string
          format: uuid
          description: 'Generated on the node at installation (§6.1).'
        csr_pem:
          type: string
          maxLength: 8192
          pattern: '^-----BEGIN CERTIFICATE REQUEST-----\r?\n'
          description: PKCS#10 CSR (PEM) for an ECDSA P-256 key generated on the node. The private key never leaves the node.
        proof:
          type: string
          minLength: 8
          maxLength: 256
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
        platform:
          $ref: '#/components/schemas/NodePlatform'
        agent_release:
          $ref: '#/components/schemas/ComponentVersion'
    EnrollResponse:
      type: object
      description: |
        Enrollment result (§14.7). Contains public material only and can be safely
        re-fetched by the same key holder. No NetBird setup key or other secret is
        included.
      required: [node_id, node_incarnation_id, lifecycle_state, publication_intent, certificate_pem, ca_chain_pem, certificate_serial, certificate_not_after, next]
      properties:
        node_id:
          type: string
          format: uuid
        node_incarnation_id:
          type: string
          format: uuid
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        publication_intent:
          $ref: '#/components/schemas/PublicationIntent'
        certificate_pem:
          type: string
          maxLength: 16384
          description: Public client certificate bound to the node and incarnation.
        ca_chain_pem:
          type: string
          maxLength: 32768
          description: Public issuing chain.
        certificate_serial:
          type: string
          pattern: '^[0-9a-f]{1,64}$'
          description: Lowercase hexadecimal certificate serial number.
        certificate_not_after:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        next:
          type: string
          enum: [/api/v1/agent/desired-state]
    AgentBootstrap:
      type: object
      description: One-time NetBird setup credential delivered only over agent mTLS (D-015, §6.4). TEST ONLY examples are not usable keys.
      additionalProperties: false
      required: [external_key_id, setup_key, expires_at]
      properties:
        external_key_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Opaque NetBird setup key ID, retained for reconciliation.
        setup_key:
          type: string
          minLength: 1
          maxLength: 4096
          description: One-off bootstrap secret; never log, audit or replay it.
        expires_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          description: UTC expiry of the bootstrap credential. The server also enforces the separate delivery deadline.
    CertificateRenewRequest:
      type: object
      required: [renewal_request_id, node_id, node_incarnation_id, csr_pem]
      additionalProperties: false
      properties:
        renewal_request_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
          description: 'Consistency check against the certificate identity.'
        node_incarnation_id:
          type: string
          format: uuid
          description: 'Consistency check against the certificate identity.'
        csr_pem:
          type: string
          maxLength: 8192
          pattern: '^-----BEGIN CERTIFICATE REQUEST-----\r?\n'
    CertificateRenewResponse:
      type: object
      required: [certificate_pem, ca_chain_pem, certificate_serial, not_before, not_after]
      properties:
        certificate_pem:
          type: string
          maxLength: 16384
        ca_chain_pem:
          type: string
          maxLength: 32768
        certificate_serial:
          type: string
          pattern: '^[0-9a-f]{1,64}$'
        not_before:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        not_after:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'

    # ============================================================ agent: desired state §14.7
    DesiredStateEnvelope:
      type: object
      description: |
        Signed desired state (§14.7, §16.2). Signed with a `desired-state` purpose
        key. The agent verifies the envelope, then that node_id and
        node_incarnation_id equal its own identity, that config_generation is not
        older than the last accepted one, and that `issued_at <= now <
        expires_at`. An expired or unverifiable desired state turns member
        forwarding off and keeps the control channel (fail closed).
      required: [signed, signatures]
      additionalProperties: false
      properties:
        signed:
          $ref: '#/components/schemas/DesiredState'
        signatures:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/Signature'
    DesiredState:
      type: object
      description: |
        Node desired state (§14.7). Contains the node, incarnation, generation,
        validity window and the policy content the node enforces, not only
        replaceable references. The target release and the serving release set
        are separate: a new target never stops a still-supported release (§13.2).
        The serving lease is renewed separately (POST /agent/lease-renewals).
      required: [schema_version, node_id, node_incarnation_id, config_generation, publication_intent, safety_profile, policy_refs, binding_revision, desired_release_id, supported_release_policy_id, serving_release_ids, lease_renewal_endpoint, accounting_period, device_bindings, member_rate_policies, node_capacity, dns, update, issued_at, expires_at]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          enum: [1]
        node_id:
          type: string
          format: uuid
        node_incarnation_id:
          type: string
          format: uuid
        config_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Monotonic; an older generation never overwrites a newer one (§15.3).'
        publication_intent:
          $ref: '#/components/schemas/PublicationIntent'
        safety_profile:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
          description: Fixed isolation baseline profile, for example `internet-only-v1`. No policy can relax it.
        policy_refs:
          $ref: '#/components/schemas/PolicyRefs'
        binding_revision:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Revision of the device binding set below.'
        desired_release_id:
          type: string
          format: uuid
          nullable: true
          description: 'Fleet target release; null before any release is targeted.'
        supported_release_policy_id:
          type: string
          format: uuid
          description: 'release_support policy revision that defines serving_release_ids.'
        serving_release_ids:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: Releases allowed to keep serving (minimum serving set, §13.2).
          items:
            type: string
            format: uuid
        revoked_release_ids:
          type: array
          uniqueItems: true
          description: |
            Releases barred from installation and serving (§13.4, D-034).
            A node must refuse to install and must stop serving any listed release.
            Absent and empty both mean no additional revocations; neither widens
            the serving/allowed release intersections enforced by the updater.
          items:
            type: string
            format: uuid
        lease_renewal_endpoint:
          type: string
          enum: [/api/v1/agent/lease-renewals]
        accounting_period:
          $ref: '#/components/schemas/AccountingPeriod'
        device_bindings:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/DeviceBinding'
        member_rate_policies:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/MemberRatePolicy'
        node_capacity:
          type: object
          allOf:
            - $ref: '#/components/schemas/NodeCapacity'
          nullable: true
        dns:
          $ref: '#/components/schemas/DnsServiceConfig'
        update:
          type: object
          allOf:
            - $ref: '#/components/schemas/UpdateIntent'
          nullable: true
          description: The node's current authorized update job (§13.10.2), or null.
        issued_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        expires_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          description: 'End of validity of this desired state; must be after issued_at.'
    PolicyRefs:
      type: object
      required: [authorization_generation, fup_generation, dns_generation]
      additionalProperties: false
      properties:
        authorization_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        fup_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        dns_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
    AccountingPeriod:
      type: object
      description: Accounting period issued by the center (§10.4). Nodes never redefine periods in local time.
      required: [period_id, period_start, period_end]
      additionalProperties: false
      properties:
        period_id:
          $ref: '#/components/schemas/PeriodId'
        period_start:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          description: 'Inclusive.'
        period_end:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          description: 'Exclusive. The agent samples at period_end so intervals do not cross periods (§10.9).'
    DeviceBinding:
      type: object
      description: |
        Member device to overlay address binding (§10.2). Traffic from unknown
        sources, duplicate addresses or sources that do not match a valid binding
        is dropped. Usage reports carry the binding_revision in force at
        observation time.
      required: [member_id, device_id, peer_id, allowed_ipv4, allowed_ipv6, binding_revision, valid_from, valid_until]
      additionalProperties: false
      properties:
        member_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        peer_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Opaque NetBird peer ID.
        allowed_ipv4:
          type: array
          maxItems: 4
          items:
            type: string
            format: ipv4
        allowed_ipv6:
          type: array
          maxItems: 4
          items:
            type: string
            format: ipv6
        binding_revision:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        valid_from:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        valid_until:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    MemberRatePolicy:
      type: object
      description: |
        Member rate policy for this node (§11.2, §11.3). Rate scope is (member_id,
        node_id, direction): all of the member's authorized devices share one class
        per direction. down_bps/up_bps are the effective rates
        min(plan_rate, fair_use_tier_rate, node_member_rate_cap) computed
        centrally; null means no member-level limit (node capacity still applies).
      required: [member_id, generation, mode, tier_index, down_bps, up_bps, priority, reason, period_id, valid_from, valid_until]
      additionalProperties: false
      properties:
        member_id:
          type: string
          format: uuid
        generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Member policy generation; nodes report it as applied.'
        mode:
          type: string
          enum: [shadow, enforce]
        tier_index:
          type: integer
          minimum: 0
          maximum: 15
        down_bps:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          nullable: true
        up_bps:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          nullable: true
        priority:
          type: integer
          minimum: 0
          maximum: 7
        reason:
          type: string
          enum: [normal, fair_use_tier, admin_override]
        period_id:
          $ref: '#/components/schemas/PeriodId'
        valid_from:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        valid_until:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
    DnsServiceConfig:
      type: object
      description: |
        Designated resolvers (ISO04, §8.1, §12.2). Members may reach only these
        addresses on TCP/UDP 53; this never opens other ports or internal ranges.
        Domain filtering happens on the resolvers, not on the node.
      required: [resolver_ipv4, resolver_ipv6]
      additionalProperties: false
      properties:
        resolver_ipv4:
          type: array
          maxItems: 4
          items:
            type: string
            format: ipv4
        resolver_ipv6:
          type: array
          maxItems: 4
          items:
            type: string
            format: ipv6
    UpdateIntent:
      type: object
      description: |
        Authorized update job delivered through desired state (§13.10.2). The URL is
        transport only; manifest_sha256 and release_id bind the job, and the
        manifest is verified after download. The job must still be valid before a
        transaction starts; after it starts the journal governs safe completion.
      required: [node_id, incarnation_id, batch_id, target_id, job_id, attempt, generation, release_id, manifest_url, manifest_sha256, issued_at, authorization_valid_until, publication_intent]
      additionalProperties: false
      properties:
        node_id:
          type: string
          format: uuid
        incarnation_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
          nullable: true
          description: 'Null for a fleet-default sync job outside any batch (§13.1 step 5).'
        target_id:
          type: string
          format: uuid
          nullable: true
        job_id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
          maximum: 1000
        generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'update_generation; the agent rejects jobs older than the last accepted generation.'
        release_id:
          type: string
          format: uuid
        manifest_url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
        manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 'SHA-256 of the canonical JSON of the manifest envelope.'
        issued_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        authorization_valid_until:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        publication_intent:
          $ref: '#/components/schemas/PublicationIntent'

    # ============================================================ agent: observations §5 §14.4
    ForwardingBlockReason:
      type: string
      description: Why member forwarding is off on the node (fail-closed reasons).
      enum: [not_published, identity_invalid, provisioning_incomplete, policy_missing, policy_expired, lease_expired, clock_untrusted, safety_check_failed, meter_path_invalid, meter_storage_failed, outbox_full, disk_low, release_not_supported, update_in_progress, recovery_required]
    ObservationReport:
      type: object
      description: Heartbeat and observations (§14.4, §15.3 node_observations). Node times are observed_at; the center stores its own received_at.
      required: [report_id, node_id, node_incarnation_id, boot_id, observed_at, agent_version, current_release_id, last_good_release_id, applied_config_generation, applied_policy_refs, applied_binding_revision, provisioning_state, safety_status, data_health, member_forwarding_enabled, forwarding_block_reasons, lease, netbird, usage, update, checks, errors]
      additionalProperties: false
      properties:
        report_id:
          type: string
          format: uuid
          description: 'Idempotency key of the report.'
        node_id:
          type: string
          format: uuid
        node_incarnation_id:
          type: string
          format: uuid
        boot_id:
          type: string
          format: uuid
          description: 'Kernel boot ID.'
        observed_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        agent_version:
          $ref: '#/components/schemas/ComponentVersion'
        current_release_id:
          type: string
          format: uuid
          nullable: true
        last_good_release_id:
          type: string
          format: uuid
          nullable: true
        applied_config_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          nullable: true
        applied_policy_refs:
          type: object
          allOf:
            - $ref: '#/components/schemas/PolicyRefs'
          nullable: true
        applied_binding_revision:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          nullable: true
        provisioning_state:
          $ref: '#/components/schemas/ProvisioningState'
        safety_status:
          $ref: '#/components/schemas/SafetyStatus'
        data_health:
          $ref: '#/components/schemas/DataHealth'
        member_forwarding_enabled:
          type: boolean
        forwarding_block_reasons:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ForwardingBlockReason'
        lease:
          type: object
          required: [lease_id, expires_at]
          additionalProperties: false
          properties:
            lease_id:
              type: string
              format: uuid
              nullable: true
            expires_at:
              type: string
              format: date-time
              pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
              nullable: true
        netbird:
          type: object
          required: [peer_id, version, backend]
          additionalProperties: false
          properties:
            peer_id:
              type: string
              nullable: true
              maxLength: 128
            version:
              type: string
              nullable: true
              maxLength: 64
            backend:
              type: string
              enum: [kernel, userspace, unknown]
              description: Actual forwarding backend; unverified userspace paths never claim valid metering (§10.3).
        usage:
          $ref: '#/components/schemas/UsageOutboxStatus'
        update:
          type: object
          required: [job_id, generation, state, stage]
          additionalProperties: false
          properties:
            job_id:
              type: string
              format: uuid
              nullable: true
            generation:
              type: string
              pattern: '^(0|[1-9][0-9]*)$'
              maxLength: 20
              x-go-type: decstr.U64
              x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
              nullable: true
            state:
              type: string
              allOf:
                - $ref: '#/components/schemas/UpdateJobState'
              nullable: true
            stage:
              type: string
              allOf:
                - $ref: '#/components/schemas/UpdateStage'
              nullable: true
        checks:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/NodeCheck'
        errors:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/NodeError'
    UsageOutboxStatus:
      type: object
      description: Local usage stream status (§10.5, §10.6, §10.8). blocked_seq is the lowest sequence the node cannot get acknowledged.
      required: [ledger_epoch, meter_epoch_id, last_durable_event_seq, central_acked_through, blocked_seq, unacked_event_count, unacked_payload_bytes, oldest_unacked_at, acked_archive_bytes]
      additionalProperties: false
      properties:
        ledger_epoch:
          type: string
          format: uuid
          nullable: true
          description: 'Central ledger epoch the node is synchronized with.'
        meter_epoch_id:
          type: string
          format: uuid
          nullable: true
        last_durable_event_seq:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: '"0" when no event exists yet.'
        central_acked_through:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Highest contiguous ACK received in ledger_epoch; "0" when none.'
        blocked_seq:
          type: string
          pattern: '^[1-9][0-9]*$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          nullable: true
        unacked_event_count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        unacked_payload_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Sum of canonical payload bytes of unacknowledged events (§10.8).'
        oldest_unacked_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        acked_archive_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Replay archive size, budgeted separately from the unacked backlog (§10.8).'
    ObservationAccepted:
      type: object
      description: The report was durably accepted. Not a claim that it was cross-verified (§14.4).
      required: [report_id, accepted, received_at]
      properties:
        report_id:
          type: string
          format: uuid
        accepted:
          type: boolean
          enum: [true]
        received_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'

    # ============================================================ agent: usage §10.5 §10.6
    MeteringVersion:
      type: string
      description: Metering definition (§10.1). Never silently change the meaning of a version.
      enum: [forward_admission_v1]
    UsageQuality:
      type: string
      description: complete, gap (data known missing) or boundary_estimated (period split by time proportion) (§10.7, §10.9).
      enum: [complete, gap, boundary_estimated]
    UsageEvent:
      type: object
      description: |
        Immutable usage event (§10.5). One event per sampling interval holds every
        changed device record of the node. Unique key: (node_id,
        node_incarnation_id, event_seq); meter_epoch_id is content, not part of the
        key (§10.6). `payload_sha256` is the lowercase hex SHA-256 of the RFC 8785
        canonical JSON of this event object without the `payload_sha256` member
        and without any batch wrapper (`canonjson.HashHex(event,
        "payload_sha256")`). Resends reuse the stored payload byte for byte.
        `gap` is present only when quality is `gap`. interval_end is after
        interval_start; intervals are half-open.
      required: [schema_version, node_id, node_incarnation_id, meter_epoch_id, event_seq, metering_version, interval_start, interval_end, quality, records, payload_sha256]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          enum: [1]
        node_id:
          type: string
          format: uuid
        node_incarnation_id:
          type: string
          format: uuid
        meter_epoch_id:
          type: string
          format: uuid
          description: 'Counter generation; changes on counter rebuild, never resets event_seq.'
        event_seq:
          type: string
          pattern: '^[1-9][0-9]*$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Starts at 1 per node incarnation and increases forever.'
        metering_version:
          $ref: '#/components/schemas/MeteringVersion'
        interval_start:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        interval_end:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        quality:
          $ref: '#/components/schemas/UsageQuality'
        records:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/UsageRecord'
        gap:
          $ref: '#/components/schemas/UsageGap'
        payload_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    UsageRecord:
      type: object
      description: Bytes of one member device in the event interval, from the member's point of view (§10.1).
      required: [member_id, device_id, binding_revision, period_id, upload_bytes, download_bytes]
      additionalProperties: false
      properties:
        member_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        binding_revision:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Binding in force when the bytes were observed (§10.2).'
        period_id:
          $ref: '#/components/schemas/PeriodId'
        upload_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Member to Internet, counted once at the upload admission hook.'
        download_bytes:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Internet to member, counted once at the download admission hook.'
    UsageGap:
      type: object
      description: Gap record (§10.7). Unknown bytes are never reported as zero-complete or estimated into official usage.
      required: [reason, last_checkpoint_at]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [power_loss, counter_discontinuity, meter_rebuild, clock_anomaly, storage_failure, unknown]
        last_checkpoint_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
    SeqRange:
      type: object
      description: Inclusive range of event sequence numbers, start_seq <= end_seq.
      required: [start_seq, end_seq]
      additionalProperties: false
      properties:
        start_seq:
          type: string
          pattern: '^[1-9][0-9]*$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        end_seq:
          type: string
          pattern: '^[1-9][0-9]*$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
    ReplayUnavailableRange:
      type: object
      description: A range the node can no longer replay because it is outside its retention window (§10.8 step 4). The center records a gap.
      required: [start_seq, end_seq, reason]
      additionalProperties: false
      properties:
        start_seq:
          type: string
          pattern: '^[1-9][0-9]*$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        end_seq:
          type: string
          pattern: '^[1-9][0-9]*$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        reason:
          type: string
          enum: [retention_expired, local_data_lost]
    UsageBatchRequest:
      type: object
      description: A batch of usage events of one incarnation stream (§10.5). Batch limits are central parameters; the contract maximum is 1000 events.
      required: [node_id, node_incarnation_id, ledger_epoch, events]
      additionalProperties: false
      properties:
        node_id:
          type: string
          format: uuid
          description: 'Must equal the certificate identity; never overrides it.'
        node_incarnation_id:
          type: string
          format: uuid
        ledger_epoch:
          type: string
          format: uuid
          nullable: true
          description: 'Ledger epoch the node is synchronized with; null before the first checkpoint.'
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/UsageEvent'
        replay_unavailable:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReplayUnavailableRange'
    UsageEventResultStatus:
      type: string
      description: Per-event outcome (§10.6). accepted and duplicate are persisted; conflict and rejected are not counted.
      enum: [accepted, duplicate, conflict, rejected]
    UsageEventResult:
      type: object
      required: [event_seq, status, error]
      properties:
        event_seq:
          type: string
          pattern: '^[1-9][0-9]*$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        status:
          $ref: '#/components/schemas/UsageEventResultStatus'
        error:
          type: object
          nullable: true
          description: Present for conflict (USAGE_EVENT_CONFLICT) and rejected (VALIDATION_FAILED, METER_PATH_INVALID, ...).
          required: [code, message, fields]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              maxLength: 1000
            fields:
              type: array
              maxItems: 50
              items:
                $ref: '#/components/schemas/FieldError'
    UsageBatchResult:
      type: object
      description: |
        Returned after commit (§10.6). highest_contiguous_seq is the highest
        sequence N such that every event 1..N of this incarnation stream is
        durably stored ("0" when event 1 is missing). It never goes backwards
        within one ledger_epoch. blocked_seq is the lowest sequence above
        highest_contiguous_seq that is in conflict or rejected and therefore stops
        ACK progress, or null.
      required: [node_id, node_incarnation_id, ledger_epoch, highest_contiguous_seq, blocked_seq, results, received_at]
      properties:
        node_id:
          type: string
          format: uuid
        node_incarnation_id:
          type: string
          format: uuid
        ledger_epoch:
          type: string
          format: uuid
        highest_contiguous_seq:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        blocked_seq:
          type: string
          pattern: '^[1-9][0-9]*$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          nullable: true
        results:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/UsageEventResult'
        received_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'

    # ============================================================ agent: usage checkpoint §17.3
    UsageCheckpointEnvelope:
      type: object
      description: |
        Signed usage checkpoint (§17.3), signed with a `recovery` purpose key. The
        agent verifies the signature, purpose, node and incarnation binding and the
        recovery record before accepting a watermark lower than a previous ACK.
        Within one ledger_epoch the ACK never goes backwards; only a new verified
        ledger_epoch starts a new baseline.
      required: [signed, signatures]
      additionalProperties: false
      properties:
        signed:
          $ref: '#/components/schemas/UsageCheckpoint'
        signatures:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/Signature'
    UsageCheckpoint:
      type: object
      description: |
        Central ledger watermark for one node incarnation stream (§17.3). Computed
        from events that actually exist and are committed, never from
        max(event_seq) or an unchecked old checkpoint. missing_ranges lists every
        gap between highest_contiguous_seq and max_seen_seq (inclusive ranges).
        recovery_record_id is null when no restore happened in this ledger_epoch.
      required: [ledger_epoch, node_id, node_incarnation_id, highest_contiguous_seq, max_seen_seq, missing_ranges, recovery_record_id, issued_at]
      additionalProperties: false
      properties:
        ledger_epoch:
          type: string
          format: uuid
          description: 'Central data generation; not a node incarnation or meter epoch.'
        node_id:
          type: string
          format: uuid
        node_incarnation_id:
          type: string
          format: uuid
        highest_contiguous_seq:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        max_seen_seq:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        missing_ranges:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/SeqRange'
        recovery_record_id:
          type: string
          format: uuid
          nullable: true
        issued_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'

    # ============================================================ agent: update results §13.10.3
    UpdateUsageCheckpoint:
      type: object
      description: Usage stream state around the switch (§13.6 steps 8 and 11). event_seq continues across meter epochs.
      required: [closed_meter_epoch_id, last_durable_event_seq, central_acked_through, new_meter_epoch_id]
      additionalProperties: false
      properties:
        closed_meter_epoch_id:
          type: string
          format: uuid
          nullable: true
        last_durable_event_seq:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        central_acked_through:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        new_meter_epoch_id:
          type: string
          format: uuid
          nullable: true
    UpdateHealth:
      type: object
      description: Health profile results (§13.9).
      required: [processes, identity_and_state, internet_only, dns_policy, tunnel_probe]
      additionalProperties: false
      properties:
        processes:
          $ref: '#/components/schemas/HealthCheckStatus'
        identity_and_state:
          $ref: '#/components/schemas/HealthCheckStatus'
        internet_only:
          $ref: '#/components/schemas/HealthCheckStatus'
        dns_policy:
          $ref: '#/components/schemas/HealthCheckStatus'
        tunnel_probe:
          $ref: '#/components/schemas/HealthCheckStatus'
    UpdateResult:
      type: object
      description: |
        Update job progress or result (§13.10.3). `payload_hash` is the lowercase
        hex SHA-256 of the RFC 8785 canonical JSON of this object without the
        `payload_hash` member (`canonjson.HashHex(result, "payload_hash")`).
        result_id is the idempotency key. A rolled_back result reports the original
        target as not achieved together with the actual current release.
        recovery_required=true means member forwarding stays off until recovery.
      required: [result_id, node_id, incarnation_id, boot_id, batch_id, target_id, job_id, attempt, generation, state, stage, requested_release_id, current_release_id, previous_release_id, manifest_sha256, policy_generation, state_schema_version, usage_checkpoint, health, publication_intent, member_forwarding_enabled, error_code, recovery_required, started_at, finished_at, payload_hash]
      additionalProperties: false
      properties:
        result_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        incarnation_id:
          type: string
          format: uuid
        boot_id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
          nullable: true
        target_id:
          type: string
          format: uuid
          nullable: true
        job_id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
          maximum: 1000
        generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        state:
          $ref: '#/components/schemas/UpdateResultState'
        stage:
          type: string
          allOf:
            - $ref: '#/components/schemas/UpdateStage'
          nullable: true
        requested_release_id:
          type: string
          format: uuid
        current_release_id:
          type: string
          format: uuid
          nullable: true
          description: 'Release actually active after this step, from local verification.'
        previous_release_id:
          type: string
          format: uuid
          nullable: true
        manifest_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        policy_generation:
          description: |
            The desired-state config_generation actually applied when this result
            was produced (§13.10.3, §14.7), not the update job generation or the
            newest received desired state. Component policy_refs belong to desired
            state; they do not replace this applied configuration generation.
            This member was already required in the v1 contract and remains so.
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        state_schema_version:
          type: integer
          minimum: 1
          maximum: 1000
        usage_checkpoint:
          type: object
          allOf:
            - $ref: '#/components/schemas/UpdateUsageCheckpoint'
          nullable: true
        health:
          type: object
          allOf:
            - $ref: '#/components/schemas/UpdateHealth'
          nullable: true
        publication_intent:
          $ref: '#/components/schemas/PublicationIntent'
        member_forwarding_enabled:
          type: boolean
        error_code:
          type: string
          allOf:
            - $ref: '#/components/schemas/ErrorCode'
          nullable: true
        recovery_required:
          type: boolean
          x-go-type: nullable.Required[bool]
          x-go-type-import:
            path: github.com/TED-H-com/Freedom-VPN/pkg/api/presence
            name: nullable
        started_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
        finished_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          nullable: true
        payload_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
    UpdateResultAck:
      type: object
      description: |
        Acknowledgement after the inbox, history, generation-conditional observed
        state, batch counts and audit were committed (§13.10.3).
        accepted_as_history=true means the result belongs to an older generation
        and was not applied as the current state.
      required: [result_id, accepted, accepted_as_history, applied_to_current_observation, observed_update_generation, received_at]
      properties:
        result_id:
          type: string
          format: uuid
        accepted:
          type: boolean
        accepted_as_history:
          type: boolean
        applied_to_current_observation:
          type: boolean
        observed_update_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
        received_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'

    # ============================================================ agent: leases §16.3
    LeaseRenewalRequest:
      type: object
      required: [renewal_request_id, node_id, node_incarnation_id, current_lease_id, applied_config_generation]
      additionalProperties: false
      properties:
        renewal_request_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        node_incarnation_id:
          type: string
          format: uuid
        current_lease_id:
          type: string
          format: uuid
          nullable: true
          description: 'Lease the node currently enforces, if any.'
        applied_config_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          nullable: true
    ServingLeaseEnvelope:
      type: object
      description: |
        Signed serving lease (§16.3), signed with a `lease` purpose key. Renewal
        never edits paid_through, grants, grace or suspension.
      required: [signed, signatures]
      additionalProperties: false
      properties:
        signed:
          $ref: '#/components/schemas/ServingLease'
        signatures:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/Signature'
    ServingLease:
      type: object
      description: |
        Finite serving lease for one node incarnation (§16.3, §9.2, §15.3).

        Server rules: `expires_at` (node_lease_end) is at most `issued_at +
        max_offline_seconds`. For each member, `lease_end` (member_lease_end) =
        min(issued_at + max_offline_seconds, effective_service_end, expires_at).
        Members whose effective_service_end is not after issued_at, or who are
        suspended, are omitted. A lease never extends any entitlement deadline.

        Node rules: verify the envelope, node and incarnation. Keep the highest
        accepted issued_at and reject older leases. Compute local deadlines from
        elapsed monotonic time, anchored conservatively at the moment the renewal
        request was sent: deadline = t_sent + (lease_end - issued_at). Replaying a
        known lease_id never restarts its time; reboot, lost time anchor or clock
        anomalies keep member forwarding off until a new lease is applied. The
        forwarding deadline is min(effective_service_end, member lease_end),
        enforced per packet by kernel timeouts before any broad
        established/related accept.
      required: [schema_version, lease_id, node_id, node_incarnation_id, authorization_generation, config_generation, issued_at, expires_at, max_offline_seconds, members]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          enum: [1]
        lease_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        node_incarnation_id:
          type: string
          format: uuid
        authorization_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Authorization policy generation the member list was computed from.'
        config_generation:
          type: string
          pattern: '^(0|[1-9][0-9]*)$'
          maxLength: 20
          x-go-type: decstr.U64
          x-go-type-import: {path: github.com/TED-H-com/Freedom-VPN/pkg/decstr}
          description: 'Desired-state generation the lease belongs to.'
        issued_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          description: 'Signed server time.'
        expires_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
          description: 'node_lease_end.'
        max_offline_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 86400
          description: configured_max_offline_lease; recommended default 24 hours (§16.3).
        members:
          type: array
          maxItems: 10000
          items:
